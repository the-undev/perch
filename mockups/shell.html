<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perch Shell</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: the combined shell. A rail that always shows the whole inventory,
   with Overview as its first entry and home screen (one screen, no scroll).
   Selecting anything fills the pane. Three switchable palettes; health and
   activity are separate marks; a permanent legend teaches the vocabulary. */
:root {
	--display: "Bricolage Grotesque", system-ui, sans-serif;
	--body: "Figtree", system-ui, sans-serif;
	color-scheme: dark;
	/* graphite + brass (default) */
	--bg: #141518;
	--rail: #17181c;
	--band: #1a1c20;
	--card: #202329;
	--card-hi: #262a31;
	--edge: #303540;
	--edge-hi: #434a58;
	--ink: #e6e4de;
	--muted: #9b9890;
	--faint: #6b6a64;
	--accent: #c2a05a;
	--green: #5fbf85;
	--amber: #d9a743;
	--red: #e2594c;
}
:root[data-palette="slate"] {
	--bg: #11151a; --rail: #141920; --band: #171d24; --card: #1c242c; --card-hi: #222b35;
	--edge: #2a333e; --edge-hi: #3b4855; --ink: #dde4e8; --muted: #8da0ab; --faint: #5f6e78;
	--accent: #8fae9b; --green: #7fb98f; --amber: #d4a94f; --red: #e06552;
}
:root[data-palette="ink"] {
	--bg: #101214; --rail: #121517; --band: #15181b; --card: #1a1e22; --card-hi: #20252a;
	--edge: #2b3036; --edge-hi: #3e454d; --ink: #ece7db; --muted: #a09a8c; --faint: #6e6960;
	--accent: #b9b2a2; --green: #66bb86; --amber: #d8a845; --red: #e25d4f;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
	margin: 0; background: var(--bg); color: var(--ink);
	font-family: var(--body); font-size: 14px;
	display: flex; overflow: hidden;
}

/* Rail */
nav {
	width: 290px; flex: none; background: var(--rail);
	border-right: 1px solid var(--edge);
	display: flex; flex-direction: column; min-height: 0;
}
nav .scroll { overflow-y: auto; flex: 1; padding: 14px 10px 10px max(12px, env(safe-area-inset-left, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; }
.brand h1 { font: 700 19px var(--display); margin: 0; flex: 1; }
.swatches { display: flex; gap: 5px; }
.swatches button { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--edge-hi); cursor: pointer; padding: 0; }
.swatches button.on { outline: 2px solid var(--accent); outline-offset: 1px; }
.sw-graphite { background: linear-gradient(135deg, #202329 50%, #c2a05a 50%); }
.sw-slate { background: linear-gradient(135deg, #1c242c 50%, #8fae9b 50%); }
.sw-ink { background: linear-gradient(135deg, #1a1e22 50%, #b9b2a2 50%); }

.row {
	display: flex; align-items: center; gap: 9px;
	padding: 8px 10px; border-radius: 7px; cursor: pointer;
	border: 1px solid transparent; transition: background 0.15s, border-color 0.15s;
}
.row:hover { background: var(--card); }
.row.sel { background: var(--card-hi); border-color: var(--edge); }
.row.home { font-weight: 600; margin-bottom: 4px; }
.row.home .glyph { color: var(--accent); width: 8px; text-align: center; }
.grp { font: 700 10.5px var(--body); letter-spacing: 0.16em; text-transform: uppercase; color: var(--faint); margin: 16px 8px 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot.red { background: var(--red); } .dot.amber { background: var(--amber); } .dot.green { background: var(--green); }
.dot.triage { background: transparent; border: 1.5px solid var(--faint); }
.row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.dim .nm { color: var(--muted); }
.act { font-size: 10px; color: var(--faint); letter-spacing: 0.04em; flex: none; }
.act.editing { color: var(--accent); }

.legend {
	flex: none; border-top: 1px solid var(--edge);
	padding: 10px 14px calc(12px + env(safe-area-inset-bottom, 0px));
	display: flex; flex-wrap: wrap; gap: 6px 14px;
	font-size: 10.5px; color: var(--faint);
}
.legend span { display: inline-flex; align-items: center; gap: 5px; }

/* Pane */
main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.pane { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding: 20px max(26px, env(safe-area-inset-right, 0px)) 20px 26px; animation: appear 0.22s ease; }
.pane.scrolls { overflow-y: auto; }
@keyframes appear { from { opacity: 0; transform: translateY(6px); } }

/* Overview home */
.ovhead { display: flex; align-items: baseline; gap: 20px; flex: none; flex-wrap: wrap; }
.ovhead h2 { font: 700 26px/1 var(--display); margin: 0; }
.totals { display: flex; gap: 16px; font-weight: 600; font-size: 13px; }
.totals .red { color: var(--red); } .totals .amber { color: var(--amber); } .totals .green { color: var(--green); }
.ovhead .scanned { margin-left: auto; color: var(--faint); font-size: 12px; }
.bandlabel { font: 700 11px var(--body); letter-spacing: 0.16em; text-transform: uppercase; color: var(--faint); margin: 16px 0 8px; display: flex; align-items: center; gap: 12px; flex: none; }
.bandlabel::after { content: ""; height: 1px; background: var(--edge); flex: 1; }
.tier1 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; flex: none; }
.tier2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; flex: none; }
.card {
	background: linear-gradient(172deg, var(--card), var(--band));
	border: 1px solid var(--edge); border-radius: 9px;
	padding: 13px 15px; display: flex; flex-direction: column; gap: 4px;
	cursor: pointer; transition: border-color 0.15s, background 0.15s;
}
.card:hover, .card:focus-visible { border-color: var(--edge-hi); background: var(--card-hi); outline: none; }
.card .head { display: flex; align-items: center; gap: 9px; }
.card h3 { font: 700 16.5px/1.1 var(--display); margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tier1 .card h3 { font-size: 19px; }
.statusword { font: 600 10px var(--body); letter-spacing: 0.1em; text-transform: uppercase; flex: none; }
.statusword.red { color: var(--red); } .statusword.amber { color: var(--amber); } .statusword.green { color: var(--faint); }
.card .sum { color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.card .foot { display: flex; gap: 12px; font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; margin-top: 3px; flex-wrap: wrap; }
.card .foot b { color: var(--ink); font-weight: 600; }
.strips { display: flex; gap: 12px; margin-top: auto; padding-top: 16px; flex: none; flex-wrap: wrap; }
.strip {
	flex: 1; min-width: 230px; background: var(--band);
	border: 1px dashed var(--edge); border-radius: 8px;
	padding: 10px 14px; color: var(--muted); font-size: 12.5px;
	display: flex; align-items: center; gap: 12px; cursor: pointer; transition: border-color 0.15s;
}
.strip:hover { border-color: var(--edge-hi); }
.strip b { color: var(--ink); font: 700 20px var(--display); }

/* Detail */
.dhead { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.dhead h2 { font: 700 36px/1 var(--display); margin: 0; letter-spacing: -0.01em; }
.dhead .meta { color: var(--faint); font-size: 13px; }
.sentence { font-size: 16px; color: var(--muted); margin: 12px 0 0; max-width: 72ch; line-height: 1.55; }
.facts { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 20px; padding: 16px 20px; background: var(--band); border: 1px solid var(--edge); border-radius: 10px; }
.fact .v { font: 700 26px var(--display); font-variant-numeric: tabular-nums; }
.fact .v.warn { color: var(--amber); } .fact .v.bad { color: var(--red); }
.fact .k { font-size: 11.5px; color: var(--faint); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-top: 24px; align-items: start; }
.panel { background: var(--card); border: 1px solid var(--edge); border-radius: 10px; padding: 16px 18px; min-width: 0; }
.panel h4 { font: 700 11.5px var(--body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); margin: 0 0 10px; }
.panel table { width: 100%; border-collapse: collapse; font-size: 14px; }
.panel td { padding: 7px 0; border-top: 1px solid var(--edge); vertical-align: top; }
.panel tr:first-child td { border-top: 0; }
.panel td.v { text-align: right; color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; padding-left: 14px; }
.bar { height: 4px; border-radius: 2px; background: var(--edge); margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); }
.actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
.actions button {
	background: var(--card); border: 1px solid var(--edge); color: var(--ink);
	font: 500 13.5px var(--body); border-radius: 7px; padding: 9px 15px; cursor: pointer;
	transition: background 0.15s, border-color 0.15s;
}
.actions button:hover { background: var(--card-hi); border-color: var(--edge-hi); }
.listpane h2 { font: 700 26px var(--display); margin: 0 0 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.card.dashed { border-style: dashed; }
.card.dashed h3 { color: var(--muted); }
@media (max-width: 860px) { body { flex-direction: column; overflow: auto; } nav { width: auto; } .pane { overflow: visible; } }
@media (prefers-reduced-motion: reduce) { .pane { animation: none; } }
</style>
</head>
<body>
<nav>
	<div class="scroll" id="rail">
		<div class="brand"><h1>perch</h1>
			<div class="swatches">
				<button class="sw-graphite on" data-palette="" title="graphite"></button>
				<button class="sw-slate" data-palette="slate" title="slate"></button>
				<button class="sw-ink" data-palette="ink" title="ink"></button>
			</div>
		</div>
	</div>
	<div class="legend">
		<span><span class="dot red"></span>attention</span>
		<span><span class="dot amber"></span>drifting</span>
		<span><span class="dot green"></span>settled</span>
		<span><span class="dot triage"></span>not adopted</span>
		<span><span class="act editing">EDITING</span>&nbsp;activity, separate from health</span>
	</div>
</nav>
<main><div class="pane" id="pane"></div></main>
<script src="./data.js"></script>
<script>
const { items, scannedAt } = window.PERCH_DATA;
const ago = (d) => d === null ? "—" : d === 0 ? "today" : d === 1 ? "yesterday" : `${d}d ago`;
const adopted = items.filter((i) => i.adopted);
const triage = items.filter((i) => !i.adopted && i.local);
const forgeOnly = items.filter((i) => !i.local);
const rank = { red: 0, amber: 1, green: 2 };

/* Palette switcher */
for (const b of document.querySelectorAll(".swatches button")) {
	b.addEventListener("click", () => {
		document.documentElement.dataset.palette = b.dataset.palette;
		if (!b.dataset.palette) delete document.documentElement.dataset.palette;
		for (const x of document.querySelectorAll(".swatches button")) x.classList.toggle("on", x === b);
		try { localStorage.setItem("perch-palette", b.dataset.palette ?? ""); } catch {}
	});
}
try {
	const saved = localStorage.getItem("perch-palette");
	if (saved) document.querySelector(`.swatches button[data-palette="${saved}"]`)?.click();
} catch {}

function activityWord(it) {
	const a = it.git?.activity;
	return a === "editing" ? "editing" : a === "in-progress" ? "in flight" : "";
}
function summary(it) {
	const g = it.git;
	if (!g) return `only on ${it.forges.map((f) => f.forge).join(" and ")}`;
	const bits = [];
	if (g.uncommitted) bits.push(`${g.uncommitted} uncommitted`);
	if (g.unpushed) bits.push(`${g.unpushed} unpushed`);
	if (g.driftDays) bits.push(`drifting ${g.driftDays}d`);
	if (it.work.bugs) bits.push(`${it.work.bugs} bugs`);
	if (g.backup === "no-remote") bits.push("one disk only");
	return bits.length ? bits.join(" · ") : `clean · touched ${ago(it.lastTouchedDays)}`;
}
function sentence(it) {
	const s = summary(it).replaceAll(" · ", ", ");
	return (s.charAt(0).toUpperCase() + s.slice(1) + ".").replace("Only on", "Lives only on");
}

/* Rail */
const rail = document.getElementById("rail");
const rows = new Map();
function addRow(id, html, cls, onClick) {
	const r = document.createElement("div");
	r.className = `row ${cls}`;
	r.tabIndex = 0;
	r.innerHTML = html;
	r.addEventListener("click", onClick);
	r.addEventListener("keydown", (e) => { if (e.key === "Enter") onClick(); });
	rail.appendChild(r);
	rows.set(id, r);
}
addRow("home", `<span class="glyph">◆</span><span class="nm">Overview</span>`, "home", () => showOverview());
const groups = [
	["Machine & Home", adopted.filter((i) => i.tier === "machine-home"), false],
	["Projects", adopted.filter((i) => i.tier === "projects"), false],
	["Not adopted", triage, true],
	["Forge only", forgeOnly, true],
];
for (const [label, list, dim] of groups) {
	if (!list.length) continue;
	const h = document.createElement("div");
	h.className = "grp";
	h.textContent = `${label} · ${list.length}`;
	rail.appendChild(h);
	for (const it of [...list].sort((a, b) => rank[a.health] - rank[b.health])) {
		addRow(it.id,
			`<span class="dot ${dim ? "triage" : it.health}"></span><span class="nm">${it.name}</span><span class="act ${it.git?.activity === "editing" ? "editing" : ""}">${activityWord(it)}</span>`,
			dim ? "dim" : "", () => showDetail(it));
	}
}
function selectRow(id) { for (const [k, r] of rows) r.classList.toggle("sel", k === id); }

/* Pane: overview */
const pane = document.getElementById("pane");
function rerender(el) { el.style.animation = "none"; void el.offsetWidth; el.style.animation = ""; }
function cardHtml(it, big) {
	return `
		<div class="head"><span class="dot ${it.adopted ? it.health : "triage"}"></span><h3>${it.name}</h3>
			<span class="statusword ${it.health}">${it.adopted ? (it.health === "amber" ? "drifting" : it.health === "green" ? "settled" : "attention") : "not adopted"}</span></div>
		<div class="sum">${summary(it)}</div>
		<div class="foot">
			${activityWord(it) ? `<span class="act editing">${activityWord(it).toUpperCase()}</span>` : ""}
			${it.git ? `<span><b>${it.git.branch}</b></span>` : ""}
			${it.work.total ? `<span><b>${it.work.total}</b> open</span>` : ""}
			${it.ci ? `<span>ci <b>${it.ci.conclusion}</b></span>` : ""}
		</div>`;
}
function showOverview() {
	selectRow("home");
	pane.classList.remove("scrolls");
	const tally = { red: 0, amber: 0, green: 0 };
	for (const it of adopted) tally[it.health]++;
	pane.innerHTML = `
		<div class="ovhead"><h2>Overview</h2>
			<div class="totals"><span class="red">${tally.red} attention</span><span class="amber">${tally.amber} drifting</span><span class="green">${tally.green} settled</span></div>
			<div class="scanned">scanned ${new Date(scannedAt).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })} · tiers provisional</div></div>
		<div class="bandlabel">Machine &amp; Home</div>
		<div class="tier1">${adopted.filter((i) => i.tier === "machine-home").sort((a, b) => rank[a.health] - rank[b.health]).map((it) => `<article class="card" data-id="${it.id}">${cardHtml(it, true)}</article>`).join("")}</div>
		<div class="bandlabel">Projects</div>
		<div class="tier2">${adopted.filter((i) => i.tier === "projects").sort((a, b) => rank[a.health] - rank[b.health] || (a.lastTouchedDays ?? 999) - (b.lastTouchedDays ?? 999)).map((it) => `<article class="card" data-id="${it.id}">${cardHtml(it)}</article>`).join("")}</div>
		<div class="strips">
			<div class="strip" id="s-triage"><b>${triage.length}</b><span>repos on disk, not adopted — decide from here</span></div>
			<div class="strip" id="s-forge"><b>${forgeOnly.length}</b><span>on a forge with no local copy: ${forgeOnly.map((f) => f.name).join(", ")}</span></div>
			<div class="strip"><b>14</b><span>archived on the forges, never shown</span></div>
		</div>`;
	for (const el of pane.querySelectorAll(".card[data-id]")) {
		el.addEventListener("click", () => showDetail(items.find((i) => i.id === el.dataset.id)));
	}
	pane.querySelector("#s-triage").addEventListener("click", () => showList("Not adopted", triage));
	pane.querySelector("#s-forge").addEventListener("click", () => showList("Forge only", forgeOnly));
	rerender(pane);
}

/* Pane: detail */
function showDetail(it) {
	selectRow(it.id);
	pane.classList.add("scrolls");
	const row = (k, v) => `<tr><td>${k}</td><td class="v">${v}</td></tr>`;
	const facts = [];
	if (it.git) {
		facts.push([it.git.uncommitted, "uncommitted", it.git.uncommitted ? "warn" : ""]);
		facts.push([it.git.unpushed, "unpushed", it.git.unpushed ? "warn" : ""]);
		facts.push([it.git.driftDays ?? 0, "days drift", (it.git.driftDays ?? 0) >= 7 ? "warn" : ""]);
	}
	facts.push([it.work.bugs, "bugs", it.work.bugs ? "bad" : ""]);
	facts.push([it.work.total - it.work.bugs, "open items", ""]);
	if (it.ci) facts.push([it.ci.conclusion, "latest ci", it.ci.conclusion === "failure" ? "bad" : ""]);
	const panels = [];
	if (it.git?.branches?.length) panels.push(`<div class="panel"><h4>Branches</h4><table>${it.git.branches.map((b) => row(`<b>${b.name}</b><br><span style="color:var(--muted)">${b.subject ?? ""}</span>`, ago(b.daysAgo))).join("")}</table></div>`);
	if (it.groups.length) panels.push(`<div class="panel"><h4>Roadmap</h4><table>${it.groups.map((g) => {
		const pct = g.done ? Math.round((g.done / g.items) * 100) : null;
		return row(`${g.heading}${pct !== null ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ""}`, g.done ? `${g.done}/${g.items}` : `${g.items}`);
	}).join("")}</table></div>`);
	if (it.finalised.length) panels.push(`<div class="panel"><h4>Finalised on ${it.finalised[0].forge}</h4><table>${it.finalised.map((c) => row(c.subject, c.at ? c.at.slice(0, 10) : "")).join("")}</table></div>`);
	if (it.flags.length) panels.push(`<div class="panel"><h4>Flags</h4><table>${it.flags.map((f) => row(f.detail ?? f.flag, f.level)).join("")}</table></div>`);
	pane.innerHTML = `
		<div class="dhead"><h2>${it.name}</h2>
			<span class="statusword ${it.adopted ? it.health : ""}" style="font-size:12px">${it.adopted ? it.health : "not adopted"}</span>
			${activityWord(it) ? `<span class="act editing" style="font-size:11px">${activityWord(it).toUpperCase()}</span>` : ""}
			<span class="meta">${it.id} · ${it.forges.map((f) => f.fullName).join(" + ") || "no forge"} · last session ${ago(it.lastSessionDays)}</span></div>
		<p class="sentence">${sentence(it)}</p>
		<div class="facts">${facts.map((f) => `<div class="fact"><div class="v ${f[2]}">${f[0]}</div><div class="k">${f[1]}</div></div>`).join("")}</div>
		<div class="actions"><button>Open zellij tab</button><button>VS Code</button><button>Files</button>${it.forges.map((f) => `<button>${f.forge}</button>`).join("")}</div>
		<div class="cols">${panels.join("")}</div>`;
	rerender(pane);
}
function showList(title, list) {
	selectRow(null);
	pane.classList.add("scrolls");
	pane.innerHTML = `<div class="listpane"><h2>${title}</h2><div class="grid">
		${list.map((it) => `<article class="card dashed" data-id="${it.id}">${cardHtml(it)}</article>`).join("")}</div></div>`;
	for (const el of pane.querySelectorAll(".card[data-id]")) {
		el.addEventListener("click", () => showDetail(items.find((i) => i.id === el.dataset.id)));
	}
	rerender(pane);
}
window.addEventListener("keydown", (e) => { if (e.key === "Escape") showOverview(); });
showOverview();
</script>
</body>
</html>
