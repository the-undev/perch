<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Aviary III</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Aviary, third pass. A live scene: the sky follows the real clock (click
   it to preview the phases). Wider size range, a legible fence, a correct
   moon, more sky. Trouble perches leftmost by rule. Clicking a bird zooms
   into a Shell-style detail view: the test of whether the scene and the
   shell are one world at two depths. */
:root {
	--ink: #e9e4d8;
	--muted: #9d978a;
	--faint: #6e695f;
	--body-c: #272b31;
	--body-dim: #23262c;
	--green: #66bb86;
	--amber: #d8a845;
	--red: #e25d4f;
	--accent: #b9b2a2;
	--card: #1a1e22;
	--band: #15181b;
	--edge: #2b3036;
	--edge-hi: #3e454d;
	--display: "Bricolage Grotesque", system-ui, sans-serif;
	--body: "Figtree", system-ui, sans-serif;
	color-scheme: dark;
	/* sky phases set these */
	--sky-top: #0d1016;
	--sky-low: #1a1d24;
	--horizon: #23262d;
	--wire: #3a3e46;
	--post: #2a2d34;
}
:root[data-phase="day"] { --sky-top: #1c2733; --sky-low: #2b3a47; --horizon: #394550; --wire: #4b5563; --post: #39414c; }
:root[data-phase="dawn"] { --sky-top: #16181f; --sky-low: #2e2a33; --horizon: #4a3a3c; --wire: #46434e; --post: #353039; }
:root[data-phase="night"] { --sky-top: #090b10; --sky-low: #10131a; --horizon: #171a21; --wire: #333741; --post: #23262e; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: linear-gradient(var(--sky-top), var(--sky-low) 72%, var(--horizon)); color: var(--ink); font-family: var(--body); overflow: hidden; transition: background 1s; }
header {
	position: fixed; top: 0; left: 0; right: 0; z-index: 2;
	display: flex; align-items: baseline; gap: 20px; flex-wrap: wrap;
	padding: 16px max(22px, env(safe-area-inset-right, 0px)) 0 max(22px, env(safe-area-inset-left, 0px));
	pointer-events: none;
}
header h1 { font: 700 22px var(--display); margin: 0; }
.totals { display: flex; gap: 16px; font-weight: 600; font-size: 13px; }
.totals .red { color: var(--red); } .totals .amber { color: var(--amber); } .totals .green { color: var(--green); }
header .scanned { margin-left: auto; color: var(--faint); font-size: 12px; }
svg#scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.sky-hit { cursor: pointer; }
.bird { cursor: pointer; }
.bird .label { font: 500 13.5px var(--body); fill: var(--muted); text-anchor: middle; }
.bird:hover .label { fill: var(--ink); }
.bird .flock { transition: transform 0.2s; }
.bird:hover .flock { transform: translateY(-4px); }
.fencebird .label { fill: #8e897d; font-size: 12.5px; }
.wirelabel { font: 700 11px var(--body); letter-spacing: 0.18em; text-transform: uppercase; fill: var(--faint); }
.wiretally { font: 500 11px var(--body); fill: var(--faint); }
.wiretally .red { fill: var(--red); } .wiretally .amber { fill: var(--amber); }
.tip {
	position: fixed; z-index: 3; pointer-events: none;
	background: #171a1f; border: 1px solid #333841; border-radius: 8px;
	padding: 9px 12px; font-size: 12.5px; color: var(--muted);
	max-width: 300px; display: none; box-shadow: 0 16px 40px -12px rgb(0 0 0 / 0.7);
}
.tip b { color: var(--ink); }
.legend {
	position: fixed; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; z-index: 2;
	display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;
	font-size: 11px; color: var(--faint);
	padding-inline: max(16px, env(safe-area-inset-left, 0px));
}
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

/* Zoomed detail: the Shell II pane, entered from the bird. */
#detail {
	position: fixed; inset: 0; z-index: 5; display: none;
	background: var(--band);
	overflow-y: auto;
	padding: 26px max(34px, env(safe-area-inset-right, 0px)) 40px max(34px, env(safe-area-inset-left, 0px));
	transform-origin: 50% 50%;
}
#detail.show { display: block; }
#detail .back {
	background: var(--card); border: 1px solid var(--edge); color: var(--muted);
	font: 500 13px var(--body); border-radius: 999px; padding: 7px 16px; cursor: pointer; margin-bottom: 18px;
}
#detail .back:hover { color: var(--ink); border-color: var(--edge-hi); }
.dhead { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.dhead h2 { font: 700 38px/1 var(--display); margin: 0; }
.statusword { font: 600 11px var(--body); letter-spacing: 0.12em; text-transform: uppercase; }
.statusword.red { color: var(--red); } .statusword.amber { color: var(--amber); } .statusword.green { color: var(--green); }
.dhead .meta { color: var(--faint); font-size: 13px; }
.sentence { font-size: 16px; color: var(--muted); margin: 12px 0 0; max-width: 72ch; line-height: 1.55; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 12px; margin-top: 20px; max-width: 1100px; }
.fact { background: var(--card); border: 1px solid var(--edge); border-radius: 10px; padding: 14px 16px; text-align: center; }
.fact .v { font: 700 26px var(--display); font-variant-numeric: tabular-nums; }
.fact .v.warn { color: var(--amber); } .fact .v.bad { color: var(--red); }
.fact .k { font-size: 11px; color: var(--faint); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 3px; }
.actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
.actions button { display: inline-flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--edge); color: var(--ink); font: 500 13.5px var(--body); border-radius: 8px; padding: 10px 16px; cursor: pointer; }
.actions button:hover { background: #20252a; border-color: var(--edge-hi); }
.actions svg { width: 15px; height: 15px; stroke: var(--accent); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.actions .ext { color: var(--faint); font-size: 11px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-top: 24px; align-items: start; max-width: 1400px; }
.panel { background: var(--card); border: 1px solid var(--edge); border-radius: 10px; padding: 16px 18px; min-width: 0; }
.panel h4 { font: 700 11.5px var(--body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); margin: 0 0 10px; }
.panel table { width: 100%; border-collapse: collapse; font-size: 14px; }
.panel td { padding: 7px 0; border-top: 1px solid var(--edge); vertical-align: top; }
.panel tr:first-child td { border-top: 0; }
.panel td.v { text-align: right; color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; padding-left: 14px; }
</style>
</head>
<body>
<header>
	<h1>The Aviary</h1>
	<div class="totals" id="totals"></div>
	<div class="scanned" id="scanned"></div>
</header>
<svg id="scene" aria-label="Projects as birds on wires"></svg>
<div class="tip" id="tip"></div>
<div id="detail"></div>
<div class="legend">
	<span><i style="background:var(--red)"></i>attention</span>
	<span><i style="background:var(--amber)"></i>drifting</span>
	<span><i style="background:var(--green)"></i>settled</span>
	<span>higher wire = more important · leftmost = needs you first · plumper = more outstanding work · ♪ = being edited</span>
	<span>click the sky to change the hour</span>
</div>
<script src="./data.js"></script>
<script>
const { items, scannedAt } = window.PERCH_DATA;
const svgNS = "http://www.w3.org/2000/svg";
const ago = (d) => d === null ? "—" : d === 0 ? "today" : d === 1 ? "yesterday" : `${d}d ago`;
const adopted = items.filter((i) => i.adopted);
const triage = items.filter((i) => !i.adopted);
const rank = { red: 0, amber: 1, green: 2 };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

const tally = { red: 0, amber: 0, green: 0 };
for (const it of adopted) tally[it.health]++;
document.getElementById("totals").innerHTML =
	`<span class="red">${tally.red} attention</span><span class="amber">${tally.amber} drifting</span><span class="green">${tally.green} settled</span>`;

/* The sky follows the real clock; clicking it previews the other phases. */
const PHASES = ["dawn", "day", "dusk", "night"];
function phaseForHour(h) { return h < 6 ? "night" : h < 9 ? "dawn" : h < 17 ? "day" : h < 21 ? "dusk" : "night"; }
let phase = phaseForHour(new Date().getHours());
let phaseOverride = false;
function applyPhase() {
	if (phase === "dusk") delete document.documentElement.dataset.phase;
	else document.documentElement.dataset.phase = phase;
	document.getElementById("scanned").textContent =
		`${phase} scan, ${new Date(scannedAt).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}${phaseOverride ? " · previewing" : ""}`;
	draw();
}

function summary(it) {
	const g = it.git;
	if (!g) return `only on ${it.forges.map((f) => f.forge).join(" and ")}`;
	const bits = [];
	if (g.uncommitted) bits.push(`${g.uncommitted} uncommitted`);
	if (g.unpushed) bits.push(`${g.unpushed} unpushed`);
	if (g.driftDays) bits.push(`drifting ${g.driftDays}d`);
	if (it.work.bugs) bits.push(`${it.work.bugs} bugs`);
	if (g.backup === "no-remote") bits.push("one disk only");
	return bits.length ? bits.join(" · ") : `clean, touched ${ago(it.lastTouchedDays)}`;
}
const sentence = (it) => {
	const s = summary(it).replaceAll(" · ", ", ");
	return (s.charAt(0).toUpperCase() + s.slice(1) + ".").replace("Only on", "Lives only on");
};
function hash(s) { let h = 7; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }

const scene = document.getElementById("scene");
const tip = document.getElementById("tip");
const el = (name, attrs, parent) => {
	const n = document.createElementNS(svgNS, name);
	for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
	(parent ?? scene).appendChild(n);
	return n;
};

function draw() {
	scene.innerHTML = "";
	const W = 2000;
	const H = Math.max(850, Math.min(1500, Math.round(W * innerHeight / Math.max(innerWidth, 1))));
	scene.setAttribute("viewBox", `0 0 ${W} ${H}`);
	scene.setAttribute("preserveAspectRatio", "xMidYMid meet");
	const M = 120;

	/* Sky hit area for the phase preview */
	const hit = el("rect", { x: 0, y: 0, width: W, height: H * 0.4, fill: "transparent", class: "sky-hit" });
	hit.addEventListener("click", () => { phaseOverride = true; phase = PHASES[(PHASES.indexOf(phase) + 1) % PHASES.length]; applyPhase(); });

	/* Sun or moon. The crescent is one path, so it cannot misalign. */
	const cx = W - 300, cy = H * 0.13;
	if (phase === "day" || phase === "dawn") {
		el("circle", { cx, cy, r: 42, fill: phase === "day" ? "#e8d9a8" : "#d9a86a", opacity: 0.9 });
		el("circle", { cx, cy, r: 58, fill: phase === "day" ? "#e8d9a8" : "#d9a86a", opacity: 0.12 });
	} else {
		el("path", { d: `M ${cx} ${cy - 44} A 44 44 0 1 0 ${cx} ${cy + 44} A 34 34 0 1 1 ${cx} ${cy - 44} Z`, fill: "#c9c4b4", opacity: 0.85 });
	}
	/* Stars: none by day, a few at dawn and dusk, a field at night; some twinkle. */
	const starCount = phase === "day" ? 0 : phase === "night" ? 110 : 60;
	for (let i = 0; i < starCount; i++) {
		const sh = hash(`star${i}`);
		const s = el("circle", {
			cx: (sh % 997) / 997 * W, cy: ((sh >> 9) % 997) / 997 * H * 0.5,
			r: (sh % 11) / 11 * 1.4 + 0.3, fill: "#9aa0ae",
			opacity: 0.25 + ((sh >> 5) % 40) / 100,
		});
		if (!reduce && i % 7 === 0) s.animate?.(
			[{ opacity: 0.15 }, { opacity: 0.7 }, { opacity: 0.15 }],
			{ duration: 3000 + (sh % 4000), iterations: Infinity, easing: "ease-in-out" });
	}

	const sag = 22;
	function wire(y, label, list, thick) {
		el("path", { d: `M -20 ${y - 12} Q ${W / 2} ${y + sag} ${W + 20} ${y - 12}`, stroke: "var(--wire)", "stroke-width": thick, fill: "none" });
		if (label) {
			const t = el("text", { x: 36, y: y - 26, class: "wirelabel" });
			t.textContent = label;
			const red = list.filter((i) => i.health === "red").length;
			const amber = list.filter((i) => i.health === "amber").length;
			const tt = el("text", { x: 36 + label.length * 9 + 18, y: y - 26, class: "wiretally" });
			tt.innerHTML = red || amber
				? `${red ? `<tspan class="red">${red} attention</tspan>` : ""}${red && amber ? " · " : ""}${amber ? `<tspan class="amber">${amber} drifting</tspan>` : ""}`
				: "all settled";
		}
	}
	const wireY = (y, x) => {
		const t = (x + 20) / (W + 40);
		return (1 - t) * (1 - t) * (y - 12) + 2 * (1 - t) * t * (y + sag) + t * t * (y - 12);
	};

	function spread(n, cap) {
		if (n === 0) return [];
		if (n === 1) return [W / 2];
		const span = Math.min((n - 1) * cap, W - 2 * M);
		const start = (W - span) / 2;
		return Array.from({ length: n }, (_, i) => start + (span / (n - 1)) * i);
	}

	function bird(it, x, y, base, dim, labelBelow = 30) {
		x = Math.max(M, Math.min(W - M, x));
		/* Wider plumpness range than before: up to +65 per cent. */
		const plump = 1 + Math.min(it.work.total, 30) / 30 * 0.65;
		const scale = base * plump;
		const face = hash(it.id) % 2 ? 1 : -1;
		const g = el("g", { class: `bird ${dim ? "fencebird" : ""}`, transform: `translate(${x} ${y})`, tabindex: 0 });
		const flock = el("g", { class: "flock" }, g);
		const inner = el("g", { transform: `scale(${scale * face} ${scale})` }, flock);
		const bodyFill = dim ? "var(--body-dim)" : "var(--body-c)";
		const breast = dim ? "#4a4f58" : `var(--${it.health})`;
		el("line", { x1: -6, y1: -8, x2: -7, y2: 2, stroke: "#4a4e55", "stroke-width": 2.4 }, inner);
		el("line", { x1: 6, y1: -8, x2: 7, y2: 2, stroke: "#4a4e55", "stroke-width": 2.4 }, inner);
		const tail = el("path", { d: "M -16 -22 L -42 -10 L -38 -20 L -44 -26 L -20 -32 Z", fill: bodyFill }, inner);
		el("ellipse", { cx: 0, cy: -26, rx: 23, ry: 19, fill: bodyFill }, inner);
		el("path", { d: "M 10 -14 A 18 16 0 0 0 20 -34 A 23 19 0 0 1 2 -8 Z", fill: breast }, inner);
		el("circle", { cx: 14, cy: -30, r: 5.5, fill: breast, opacity: 0.9 }, inner);
		el("circle", { cx: 16, cy: -44, r: 11.5, fill: bodyFill }, inner);
		el("path", { d: "M 26 -45 L 37 -42 L 26 -39 Z", fill: "var(--accent)" }, inner);
		el("circle", { cx: 19.5, cy: -46, r: 1.8, fill: phase === "night" ? "#4a4e55" : "#0d0f12" }, inner);
		el("path", { d: "M -14 -28 Q 2 -36 8 -24 Q -2 -16 -14 -28 Z", fill: "#00000022" }, inner);
		const label = el("text", { y: labelBelow, class: "label" }, g);
		label.textContent = it.displayName;
		if (!dim && it.git?.activity === "editing" && phase !== "night") {
			const note = el("text", { x: 26 * face * scale, y: -62 * scale, fill: "var(--accent)", "font-size": 15, "text-anchor": "middle" }, g);
			note.textContent = "♪";
			if (!reduce) note.animate?.([{ opacity: 0.2 }, { opacity: 1 }, { opacity: 0.2 }], { duration: 2600, iterations: Infinity });
		}
		if (!reduce && g.animate) {
			g.animate(
				[{ transform: `translate(${x}px, ${y - 130}px)`, opacity: 0 }, { transform: `translate(${x}px, ${y}px)`, opacity: 1 }],
				{ duration: 480, delay: (hash(it.id) % 600), easing: "cubic-bezier(0.3, 1.4, 0.5, 1)", fill: "backwards" },
			);
			/* Idle: everyone bobs gently; the unhealthy fidget a little more.
			   A red bird's tail flicks now and then. Subtle by design. */
			const restless = it.health === "red" ? 2.2 : it.health === "amber" ? 1.5 : 1;
			flock.animate(
				[{ transform: "translateY(0)" }, { transform: `translateY(-${2 * restless}px)` }, { transform: "translateY(0)" }],
				{ duration: 3600 - restless * 500 + (hash(it.id) % 1500), delay: hash(it.id) % 2000, iterations: Infinity, easing: "ease-in-out" },
			);
			if (it.health === "red" && !dim) {
				tail.animate(
					[{ transform: "rotate(0deg)" }, { transform: "rotate(0deg)" }, { transform: "rotate(-9deg)" }, { transform: "rotate(0deg)" }, { transform: "rotate(0deg)" }],
					{ duration: 9000 + (hash(it.id) % 5000), iterations: Infinity, easing: "ease-in-out" },
				);
			}
		}
		g.addEventListener("mousemove", (e) => {
			tip.style.display = "block";
			tip.innerHTML = `<b>${it.displayName}</b> · ${dim ? "not adopted" : it.health}<br>${summary(it)}`;
			tip.style.left = `${Math.min(e.clientX + 16, innerWidth - 310)}px`;
			tip.style.top = `${Math.min(e.clientY + 18, innerHeight - 90)}px`;
		});
		g.addEventListener("mouseleave", () => { tip.style.display = "none"; });
		g.addEventListener("click", (e) => { e.stopPropagation(); openDetail(it, e); });
		g.addEventListener("keydown", (e) => { if (e.key === "Enter") openDetail(it, e); });
	}

	const t1 = adopted.filter((i) => i.tier === "machine-home").sort((a, b) => rank[a.health] - rank[b.health]);
	const t2 = adopted.filter((i) => i.tier === "projects").sort((a, b) => rank[a.health] - rank[b.health]);
	const rowA = t2.filter((_, i) => i % 2 === 0), rowB = t2.filter((_, i) => i % 2 === 1);
	const y1 = H * 0.26, y2 = H * 0.49, y3 = H * 0.63, yF = H * 0.82;
	wire(y1, "Machine & Home", t1, 4);
	wire(y2, "Projects", t2, 3);
	wire(y3, "", [], 3);

	/* The fence: fewer, lighter posts, a clear rail, birds above the rail
	   with labels below it, staggered so names never collide. */
	el("line", { x1: 0, y1: yF, x2: W, y2: yF, stroke: "var(--post)", "stroke-width": 8 });
	for (let x = 120; x < W; x += 320) {
		el("line", { x1: x, y1: yF - 6, x2: x, y2: Math.min(yF + 64, H - 30), stroke: "var(--post)", "stroke-width": 10, opacity: 0.7 });
	}
	const fl = el("text", { x: 36, y: yF - 70, class: "wirelabel" });
	fl.textContent = `On the fence · ${triage.length} not adopted`;

	spread(t1.length, 360).forEach((x, i) => bird(t1[i], x, wireY(y1, x), 1.35, false));
	spread(rowA.length, 330).forEach((x, i) => bird(rowA[i], x, wireY(y2, x), 0.9, false));
	spread(rowB.length, 330).forEach((x, i) => bird(rowB[i], x + 150, wireY(y3, x + 150), 0.9, false));
	spread(triage.length, 205).forEach((x, i) => bird(triage[i], x, yF + 2, 0.78, true, i % 2 ? 48 : 30));
}
applyPhase();
let rT;
addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(draw, 150); });
setInterval(() => { if (!phaseOverride) { const p = phaseForHour(new Date().getHours()); if (p !== phase) { phase = p; applyPhase(); } } }, 60_000);

/* Zoomed detail: Shell II's pane, entered from the bird and left by flying back. */
const detail = document.getElementById("detail");
const ICONS = {
	terminal: `<svg viewBox="0 0 24 24"><path d="M4 17l6-5-6-5"/><path d="M12 19h8"/></svg>`,
	code: `<svg viewBox="0 0 24 24"><path d="M8 6l-6 6 6 6"/><path d="M16 6l6 6-6 6"/></svg>`,
	folder: `<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>`,
	forge: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3.5 9h17M3.5 15h17M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>`,
};
function openDetail(it, ev) {
	tip.style.display = "none";
	const row = (k, v) => `<tr><td>${k}</td><td class="v">${v}</td></tr>`;
	const facts = [];
	if (it.git) {
		facts.push([it.git.uncommitted, "uncommitted", it.git.uncommitted ? "warn" : ""]);
		facts.push([it.git.unpushed, "unpushed", it.git.unpushed ? "warn" : ""]);
		facts.push([it.git.driftDays ?? 0, "days drift", (it.git.driftDays ?? 0) >= 7 ? "warn" : ""]);
	}
	facts.push([it.work.bugs, "bugs", it.work.bugs ? "bad" : ""]);
	facts.push([it.work.total - it.work.bugs, "open items", ""]);
	if (it.ci) facts.push([it.ci.conclusion, "latest ci", it.ci.conclusion === "failure" ? "bad" : ""]);
	const panels = [];
	if (it.git?.branches?.length) panels.push(`<div class="panel"><h4>Branches</h4><table>${it.git.branches.map((b) => row(`<b>${b.name}</b><br><span style="color:var(--muted)">${b.subject ?? ""}</span>`, ago(b.daysAgo))).join("")}</table></div>`);
	if (it.groups.length) panels.push(`<div class="panel"><h4>Roadmap</h4><table>${it.groups.map((g) => row(g.heading, g.done ? `${g.done}/${g.items}` : g.items)).join("")}</table></div>`);
	if (it.finalised.length) panels.push(`<div class="panel"><h4>Finalised on ${it.finalised[0].forge}</h4><table>${it.finalised.map((c) => row(c.subject, c.at ? c.at.slice(0, 10) : "")).join("")}</table></div>`);
	if (it.flags.length) panels.push(`<div class="panel"><h4>Flags</h4><table>${it.flags.map((f) => row(f.detail ?? f.flag, f.level)).join("")}</table></div>`);
	const act = (icon, label) => `<button title="Opens outside perch">${ICONS[icon]}${label}<span class="ext">↗</span></button>`;
	detail.innerHTML = `
		<button class="back" id="back">← back to the wires</button>
		<div class="dhead"><h2>${it.displayName}</h2>
			<span class="statusword ${it.adopted ? it.health : ""}">${it.adopted ? it.health : "not adopted"}</span>
			<span class="meta">${it.id} · ${it.forges.map((f) => f.fullName).join(" + ") || "no forge"} · last session ${ago(it.lastSessionDays)}</span></div>
		<p class="sentence">${sentence(it)}</p>
		<div class="facts">${facts.map((f) => `<div class="fact"><div class="v ${f[2]}">${f[0]}</div><div class="k">${f[1]}</div></div>`).join("")}</div>
		<div class="actions">${act("terminal", "zellij tab")}${act("code", "VS Code")}${act("folder", "Files")}${it.forges.map((f) => act("forge", f.forge)).join("")}</div>
		<div class="cols">${panels.join("")}</div>`;
	detail.classList.add("show");
	if (!reduce) {
		const ox = `${(ev.clientX / innerWidth) * 100}%`, oy = `${(ev.clientY / innerHeight) * 100}%`;
		detail.style.transformOrigin = `${ox} ${oy}`;
		detail.animate(
			[{ transform: "scale(0.1)", opacity: 0, borderRadius: "50%" }, { transform: "scale(1)", opacity: 1, borderRadius: "0" }],
			{ duration: 380, easing: "cubic-bezier(0.25, 0.9, 0.3, 1)" },
		);
	}
	document.getElementById("back").addEventListener("click", closeDetail);
}
function closeDetail() {
	if (!reduce && detail.classList.contains("show")) {
		const a = detail.animate(
			[{ transform: "scale(1)", opacity: 1 }, { transform: "scale(0.12)", opacity: 0 }],
			{ duration: 280, easing: "cubic-bezier(0.5, 0, 0.8, 0.4)" },
		);
		a.onfinish = () => detail.classList.remove("show");
	} else detail.classList.remove("show");
}
window.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDetail(); });
</script>
</body>
</html>
