<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: master-detail. A rail grouped by tier on the left, the selected
   project filling the rest. The agenda view: pick a thing, see everything
   about it. Warm dark material, crisp edges. */
:root {
	--bg: #16120e;
	--rail: #1a1511;
	--card: #241e17;
	--card-hi: #2b241b;
	--edge: #372d22;
	--ink: #ece4d4;
	--muted: #a2957f;
	--faint: #6d6252;
	--green: #63bd84;
	--amber: #dca743;
	--red: #e25c4d;
	--display: "Bricolage Grotesque", system-ui, sans-serif;
	--body: "Figtree", system-ui, sans-serif;
	color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
	margin: 0; background: var(--bg); color: var(--ink);
	font-family: var(--body); font-size: 14px;
	display: flex; overflow: hidden;
}
nav {
	width: 300px; flex: none; background: var(--rail);
	border-right: 1px solid var(--edge);
	overflow-y: auto;
	padding: 18px 12px 24px max(14px, env(safe-area-inset-left, 0px));
}
nav h1 { font: 700 20px/1 var(--display); margin: 2px 6px 16px; }
nav .grp {
	font: 700 10.5px var(--body); letter-spacing: 0.16em; text-transform: uppercase;
	color: var(--faint); margin: 16px 6px 6px;
}
.row {
	display: flex; align-items: center; gap: 9px;
	padding: 8px 10px; border-radius: 7px; cursor: pointer;
	border: 1px solid transparent;
	transition: background 0.15s, border-color 0.15s;
}
.row:hover { background: var(--card); }
.row.sel { background: var(--card-hi); border-color: var(--edge); }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.dot.red { background: var(--red); } .dot.amber { background: var(--amber); } .dot.green { background: var(--green); } .dot.triage { background: transparent; border: 1.5px solid var(--faint); }
.row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.row.triage .nm { color: var(--muted); }
.row .n { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }

main { flex: 1; min-width: 0; overflow-y: auto; padding: 26px max(30px, env(safe-area-inset-right, 0px)) 40px 30px; }
#detail { max-width: 1100px; animation: appear 0.25s ease; }
@keyframes appear { from { opacity: 0; transform: translateX(8px); } }
#detail .top { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
#detail h2 { font: 700 34px/1 var(--display); margin: 0; letter-spacing: -0.01em; }
.statusword { font: 600 11px var(--body); letter-spacing: 0.12em; text-transform: uppercase; }
.statusword.red { color: var(--red); } .statusword.amber { color: var(--amber); } .statusword.green { color: var(--green); } .statusword.triage { color: var(--faint); }
#detail .sentence { font-size: 15px; color: var(--muted); margin: 10px 0 0; max-width: 70ch; line-height: 1.5; }
.facts { display: flex; gap: 26px; flex-wrap: wrap; margin-top: 18px; padding: 14px 18px; background: var(--rail); border: 1px solid var(--edge); border-radius: 9px; }
.fact .v { font: 700 22px var(--display); font-variant-numeric: tabular-nums; }
.fact .v.warn { color: var(--amber); } .fact .v.bad { color: var(--red); }
.fact .k { font-size: 11px; color: var(--faint); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 22px; margin-top: 24px; align-items: start; }
.panel { background: var(--card); border: 1px solid var(--edge); border-radius: 9px; padding: 16px 18px; min-width: 0; }
.panel h3 { font: 700 11px var(--body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); margin: 0 0 10px; }
.panel table { width: 100%; border-collapse: collapse; font-size: 13px; }
.panel td { padding: 6px 0; border-top: 1px solid var(--edge); vertical-align: top; }
.panel tr:first-child td { border-top: 0; }
.panel td.v { text-align: right; color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; padding-left: 14px; }
.bar { height: 4px; border-radius: 2px; background: var(--edge); margin-top: 5px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); border-radius: 2px; }
.actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
.actions button {
	background: var(--card); border: 1px solid var(--edge); color: var(--ink);
	font: 500 13px var(--body); border-radius: 7px; padding: 8px 14px; cursor: pointer;
	transition: background 0.15s, border-color 0.15s;
}
.actions button:hover { background: var(--card-hi); border-color: #4a3d2d; }
.note { color: var(--faint); font-size: 11.5px; margin-top: 26px; }
@media (max-width: 760px) { body { flex-direction: column; overflow: auto; } nav { width: auto; max-height: 40vh; } }
@media (prefers-reduced-motion: reduce) { #detail { animation: none; } }
</style>
</head>
<body>
<nav id="rail"><h1>Projects</h1></nav>
<main><div id="detail"></div></main>
<script src="./data.js"></script>
<script>
const { items, scannedAt } = window.PERCH_DATA;
const ago = (d) => d === null ? "—" : d === 0 ? "today" : d === 1 ? "yesterday" : `${d} days ago`;

function sentence(it) {
	const g = it.git;
	if (!g) return `Lives only on ${it.forges.map((f) => f.forge).join(" and ")}; no copy on this machine.`;
	const parts = [];
	if (g.uncommitted) parts.push(`${g.uncommitted} file${g.uncommitted > 1 ? "s" : ""} uncommitted`);
	if (g.unpushed) parts.push(`${g.unpushed} commit${g.unpushed > 1 ? "s" : ""} unpushed`);
	if (g.driftDays) parts.push(`drifting ${g.driftDays} days`);
	if (g.backup === "no-remote") parts.push("on one disk only");
	let s = parts.length ? parts.join(", ") : `clean on ${g.branch}, touched ${ago(it.lastTouchedDays)}`;
	if (it.work.bugs) s += `; ${it.work.bugs} bugs on the roadmap`;
	else if (it.work.total) s += `; ${it.work.total} roadmap items parked`;
	return s.charAt(0).toUpperCase() + s.slice(1) + ".";
}

const rail = document.getElementById("rail");
const groups = [
	["Machine & Home", items.filter((i) => i.tier === "machine-home")],
	["Projects", items.filter((i) => i.tier === "projects")],
	["Not adopted", items.filter((i) => !i.adopted && i.local)],
	["Forge only", items.filter((i) => !i.local)],
];
const rows = new Map();
for (const [label, list] of groups) {
	if (!list.length) continue;
	const h = document.createElement("div");
	h.className = "grp";
	h.textContent = label;
	rail.appendChild(h);
	for (const it of list) {
		const r = document.createElement("div");
		const triage = !it.adopted;
		r.className = `row ${triage ? "triage" : ""}`;
		r.tabIndex = 0;
		const n = it.work.bugs ? `${it.work.bugs} bugs` : it.git?.uncommitted ? `${it.git.uncommitted} dirty` : it.work.total ? `${it.work.total}` : "";
		r.innerHTML = `<span class="dot ${triage ? "triage" : it.health}"></span><span class="nm">${it.name}</span><span class="n">${n}</span>`;
		r.addEventListener("click", () => select(it));
		r.addEventListener("keydown", (e) => { if (e.key === "Enter") select(it); });
		rail.appendChild(r);
		rows.set(it.id, r);
	}
}

const detail = document.getElementById("detail");
let current = null;
function select(it) {
	current = it;
	for (const [id, r] of rows) r.classList.toggle("sel", id === it.id);
	const row = (k, v) => `<tr><td>${k}</td><td class="v">${v}</td></tr>`;
	const facts = [];
	if (it.git) {
		facts.push([it.git.uncommitted, "uncommitted", it.git.uncommitted ? "warn" : ""]);
		facts.push([it.git.unpushed, "unpushed", it.git.unpushed ? "warn" : ""]);
		facts.push([it.git.driftDays ?? 0, "days drift", it.git.driftDays >= 7 ? "warn" : ""]);
	}
	facts.push([it.work.bugs, "bugs", it.work.bugs ? "bad" : ""]);
	facts.push([it.work.total - it.work.bugs, "open items", ""]);
	if (it.ci) facts.push([it.ci.conclusion, "latest ci", it.ci.conclusion === "failure" ? "bad" : ""]);
	const panels = [];
	if (it.git?.branches?.length) panels.push(`<div class="panel"><h3>Branches</h3><table>${it.git.branches.map((b) => row(`<b>${b.name}</b><br><span style="color:var(--muted)">${b.subject ?? ""}</span>`, ago(b.daysAgo))).join("")}</table></div>`);
	if (it.groups.length) panels.push(`<div class="panel"><h3>Roadmap</h3><table>${it.groups.map((g) => {
		const pct = g.done ? Math.round((g.done / g.items) * 100) : null;
		return row(`${g.heading}${pct !== null ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ""}`, g.done ? `${g.done}/${g.items}` : `${g.items}`);
	}).join("")}</table></div>`);
	if (it.finalised.length) panels.push(`<div class="panel"><h3>Finalised on ${it.finalised[0].forge}</h3><table>${it.finalised.map((c) => row(c.subject, c.at ? c.at.slice(0, 10) : "")).join("")}</table></div>`);
	if (it.flags.length) panels.push(`<div class="panel"><h3>Flags</h3><table>${it.flags.map((f) => row(f.detail ?? f.flag, f.level)).join("")}</table></div>`);
	detail.innerHTML = `
		<div class="top"><h2>${it.name}</h2>
			<span class="statusword ${it.adopted ? it.health : "triage"}">${it.adopted ? it.health : "not adopted"}</span>
			<span style="color:var(--faint);font-size:12px">${it.forges.map((f) => f.fullName).join(" + ") || "no forge"} · last session ${ago(it.lastSessionDays)}</span></div>
		<p class="sentence">${sentence(it)}</p>
		<div class="facts">${facts.map((f) => `<div class="fact"><div class="v ${f[2]}">${f[0]}</div><div class="k">${f[1]}</div></div>`).join("")}</div>
		<div class="actions">
			<button>Open zellij tab</button><button>VS Code</button><button>Files</button>
			${it.forges.map((f) => `<button>${f.forge}</button>`).join("")}
		</div>
		<div class="cols">${panels.join("")}</div>
		<div class="note">Scanned ${new Date(scannedAt).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}. Launch buttons are mock; groups are provisional mockup data.</div>`;
	detail.style.animation = "none";
	void detail.offsetWidth;
	detail.style.animation = "";
}
const flat = groups.flatMap(([, l]) => l);
window.addEventListener("keydown", (e) => {
	if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
	const idx = flat.indexOf(current);
	const next = flat[idx + (e.key === "ArrowDown" ? 1 : -1)];
	if (next) { select(next); e.preventDefault(); }
});
select(flat[0]);
</script>
</body>
</html>
