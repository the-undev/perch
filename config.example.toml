# perch configuration: a reference showing every field, with placeholder
# values.
#
# The live copy is ~/.config/perch/config.toml. The app writes a starter
# there when asked: one wire, the standard windows, no sources. The command
# line scanner runs with those defaults when the live copy does not exist.
# The app writes the file back without comments. No secrets here: tokens
# come from the desktop keyring at run time.
#
# Config asserts only what leaves no trace on disk or on a forge. When an
# assertion and an observation disagree, the observation wins and the
# disagreement is flagged.
#
# A presence is named local:<id>, github:<owner>/<name> or
# forgejo:<owner>/<name>. A local id is the path relative to the home
# directory.

# Presences that are one project although no remote URL proves it, for
# example [["github:someone/notes", "forgejo:someone/notes"]].
joins = []

# Presences to leave off the main view. They still appear in their forge's
# listing.
ignore = []

# The wires, top to bottom: the owner's priority bands. An adopted item
# sits on the wire its entry names, else the default. Everything config does
# not name sits on the fence beneath.
[wires]
names = ["Home", "Projects"]
default = "Projects"

# Sources: one table per connection, repeated for each. Nothing is assumed:
# a config with no sources is valid and scans nothing.

# A local source. Each include is a repository, or a directory searched for
# repositories. Nothing at or below an exclude is searched.
[[sources.local]]
include = ["~/projects"]
exclude = ["~/projects/archive"]

# A GitHub account lists the repositories it owns, read with its own
# read-only token from the keyring (secret-tool, service perch, the key named
# here; see docs/forge-access.md). A remote that no listing holds is looked up with
# the token of the account that owns it on that host. Hosts are the remote
# hosts and SSH aliases that reach the account. Forks to track are written
# owner/name; every other fork is skipped. Each account and each key appears
# once.
[[sources.github]]
account = "someone"
key = "github-someone"
hosts = ["github.com"]
tracked_forks = []

# A Forgejo account adds the instance's base URL. Each account appears once
# per instance, and each key once.
[[sources.forgejo]]
base_url = "https://forge.example.lan"
account = "someone"
key = "forgejo-someone"
hosts = ["forge.example.lan"]
tracked_forks = []

# An Uptime Kuma status page, monitored as the server it names. Each name
# appears once.
# [[sources.kuma]]
# name = "Server"
# base_url = "http://kuma.example.lan:3001"
# status_page = "status"

# Health windows: amber at the first, red at the second. Unsafe work
# (uncommitted changes, unpushed commits) ages in hours from its oldest
# change. Stalled flight, parked on a non-default branch with no new commit,
# ages in days. Each is overridable per item with the same keys.
[thresholds]
unsafe_amber_hours = 24
unsafe_red_hours = 72
stalled_amber_days = 7
stalled_red_days = 30

# Everything is scanned on the interval, counted from the end of the last
# scan.
[scan]
interval_minutes = 15
# Commits on each forge repository's default branch to read as finalised.
finalised_commits = 10

# Launch actions: what a bird's page can open, one table per action in the
# order the page offers them. A config with none offers nothing.
#
# Each table names its kind and only what differs from the kind's defaults:
# its verb, the words on the bird's page, and its command, run without a
# shell, detached from perch. The placeholders in braces are filled in at
# launch: {path} is the item's directory, and {obsidian} the Obsidian vault's
# folder name, encoded for a URI.
#
#   vscode    Open in VS Code    ["code", "{path}"]
#   nvim      Open in nvim       ["alacritty", "--working-directory", "{path}", "-e", "nvim", "."]
#   folder    Open the folder    ["xdg-open", "{path}"]
#   obsidian  Open in Obsidian   ["xdg-open", "obsidian://open?vault={obsidian}"]
#
# The obsidian kind is offered on Obsidian birds only, and may use
# {obsidian}; every other kind on every bird with a folder on this machine.
# A kind may appear more than once, each with its own verb.
#
# The zellij kind, at most once, finds the session's tab named after the
# project and goes to it, or opens one in the project's directory. A session
# that is not running opens in its terminal command, with {session} and
# {cwd}, the project's directory. The session is the item's own
# zellij_session, else the session of the longest root holding the item in
# [launch.actions.sessions], else its session. Its defaults:
#
#   verb      "Open the zellij tab"
#   zellij    ["zellij"]
#   terminal  ["alacritty", "--working-directory", "{cwd}", "-e", "zellij", "attach", "-c", "{session}"]
#   session   "main"
[[launch.actions]]
kind = "zellij"
[launch.actions.sessions]
"~/work" = "work"

[[launch.actions]]
kind = "vscode"

[[launch.actions]]
kind = "nvim"

[[launch.actions]]
kind = "folder"

# Obsidian, and a kind's verb and command overridden:
# [[launch.actions]]
# kind = "obsidian"
# verb = "Open the Obsidian vault"
# command = ["obsidian", "obsidian://open?vault={obsidian}"]

# A custom command names its verb and command, which may use {path} and
# {obsidian}; one using {obsidian} is offered on Obsidian birds only. Its icon
# is one of terminal, code, folder, forge, obsidian, adopt and edit, the
# folder unless named.
# [[launch.actions]]
# kind = "command"
# verb = "Follow the log"
# command = ["alacritty", "-e", "lnav", "{path}/logs"]
# icon = "terminal"

# How the window lives on this machine. With the tray, the default, closing
# the window hides it, and the tray icon shows it, rescans and quits. With
# the tray off there is no icon and closing the window quits; --hidden is
# ignored and a second launch always shows the window. Starting at login is
# not config: the settings page writes the autostart entry itself.
# [window]
# tray = false

# Updates. With check, the default, each scan reads the latest GitHub
# release at most hourly and says when it is newer. With install, a newer
# release is downloaded and replaces the running AppImage from the next
# start; perch never restarts itself. Run from source, install is held.
# [update]
# check = false
# install = true

# Item entries. An entry adopts the bird and puts it on a wire. Its key names
# any presence of the item: a local id, or a forge presence such as
# "forgejo:owner/name", which still applies once a local clone joins it. When
# two entries name one item, the one keyed by the item's id applies and the
# clash is flagged. A repository found inside an include directory is flagged
# as not set up until it has an entry here, even an empty one.
#
# Every field an entry can hold, each optional:
# [items."projects/example"]
# wire = "Projects"                  # one of wires.names
# name = "Example"                   # the bird's name; default the folder or repository name
# key_files = ["README.md", "docs/forge-access.md", "docs/roadmap.md"]  # default the README and roadmaps
# roadmaps = ["docs/roadmap.md"]     # replaces the standard roadmap names
# zellij_session = "main"
# unsafe_amber_hours = 12
# unsafe_red_hours = 48
# stalled_amber_days = 14
# stalled_red_days = 60
