appId: com.github.finch.perch
productName: perch
directories:
  output: dist
files:
  - out/**
  - package.json
# Read when the owner has no ~/.config/perch/config.toml.
extraResources:
  - from: ../../config.example.toml
    to: config.example.toml
linux:
  target: AppImage
  category: Development
  executableName: perch
  syncDesktopName: true
artifactName: ${productName}-${version}-${arch}.${ext}
