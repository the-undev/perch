<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perch Shell II</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Shell, revised. Ink palette first; the overview gets its hierarchy back:
   the top band is physically bigger and attention adds visual weight. The
   footer strips are gone; the rail carries that inventory. */
:root {
	--display: "Bricolage Grotesque", system-ui, sans-serif;
	--body: "Figtree", system-ui, sans-serif;
	color-scheme: dark;
	/* ink (default) */
	--bg: #101214; --rail: #121517; --band: #15181b; --card: #1a1e22; --card-hi: #20252a;
	--edge: #2b3036; --edge-hi: #3e454d; --ink: #ece7db; --muted: #a09a8c; --faint: #6e6960;
	--accent: #b9b2a2; --green: #66bb86; --amber: #d8a845; --red: #e25d4f;
}
:root[data-palette="graphite"] {
	--bg: #141518; --rail: #17181c; --band: #1a1c20; --card: #202329; --card-hi: #262a31;
	--edge: #303540; --edge-hi: #434a58; --ink: #e6e4de; --muted: #9b9890; --faint: #6b6a64;
	--accent: #c2a05a; --green: #5fbf85; --amber: #d9a743; --red: #e2594c;
}
:root[data-palette="slate"] {
	--bg: #11151a; --rail: #141920; --band: #171d24; --card: #1c242c; --card-hi: #222b35;
	--edge: #2a333e; --edge-hi: #3b4855; --ink: #dde4e8; --muted: #8da0ab; --faint: #5f6e78;
	--accent: #8fae9b; --green: #7fb98f; --amber: #d4a94f; --red: #e06552;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; display: flex; overflow: hidden; }
nav { width: 290px; flex: none; background: var(--rail); border-right: 1px solid var(--edge); display: flex; flex-direction: column; min-height: 0; }
nav .scroll { overflow-y: auto; flex: 1; padding: 14px 10px 10px max(12px, env(safe-area-inset-left, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; }
.brand h1 { font: 700 19px var(--display); margin: 0; flex: 1; cursor: pointer; }
.brand h1:hover { color: var(--accent); }
.swatches { display: flex; gap: 5px; }
.swatches button { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--edge-hi); cursor: pointer; padding: 0; }
.swatches button.on { outline: 2px solid var(--accent); outline-offset: 1px; }
.sw-ink { background: linear-gradient(135deg, #1a1e22 50%, #b9b2a2 50%); }
.sw-graphite { background: linear-gradient(135deg, #202329 50%, #c2a05a 50%); }
.sw-slate { background: linear-gradient(135deg, #1c242c 50%, #8fae9b 50%); }
.row { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 7px; cursor: pointer; border: 1px solid transparent; transition: background 0.15s, border-color 0.15s; }
.row:hover { background: var(--card); }
.row.sel { background: var(--card-hi); border-color: var(--edge); }
.row.home { font-weight: 600; margin-bottom: 4px; }
.row.home .glyph { color: var(--accent); width: 8px; text-align: center; }
.grp { font: 700 10.5px var(--body); letter-spacing: 0.16em; text-transform: uppercase; color: var(--faint); margin: 16px 8px 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot.red { background: var(--red); } .dot.amber { background: var(--amber); } .dot.green { background: var(--green); }
.dot.triage { background: transparent; border: 1.5px solid var(--faint); }
.row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.dim .nm { color: var(--muted); }
.act { font-size: 10px; color: var(--faint); letter-spacing: 0.04em; flex: none; }
.act.editing { color: var(--accent); }
.legend { flex: none; border-top: 1px solid var(--edge); padding: 10px 14px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 10.5px; color: var(--faint); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }

main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.pane { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding: 20px max(26px, env(safe-area-inset-right, 0px)) 18px 26px; animation: appear 0.22s ease; }
.pane.scrolls { overflow-y: auto; }
@keyframes appear { from { opacity: 0; transform: translateY(6px); } }

.ovhead { display: flex; align-items: baseline; gap: 20px; flex: none; flex-wrap: wrap; }
.ovhead h2 { font: 700 26px/1 var(--display); margin: 0; }
.totals { display: flex; gap: 16px; font-weight: 600; font-size: 13px; }
.totals .red { color: var(--red); } .totals .amber { color: var(--amber); } .totals .green { color: var(--green); }
.ovhead .scanned { margin-left: auto; color: var(--faint); font-size: 12px; }
.bandlabel { font: 700 11px var(--body); letter-spacing: 0.16em; text-transform: uppercase; color: var(--faint); margin: 14px 0 8px; display: flex; align-items: center; gap: 12px; flex: none; }
.bandlabel::after { content: ""; height: 1px; background: var(--edge); flex: 1; }

.tier1 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; flex: none; }
.tier2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 10px; flex: none; }
.card { background: linear-gradient(172deg, var(--card), var(--band)); border: 1px solid var(--edge); border-radius: 10px; padding: 13px 15px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
.card:hover, .card:focus-visible { border-color: var(--edge-hi); background: var(--card-hi); outline: none; }
.card.red { border-color: color-mix(in srgb, var(--red) 45%, var(--edge)); background: linear-gradient(172deg, color-mix(in srgb, var(--red) 7%, var(--card)), var(--band)); }
.card.amber { border-color: color-mix(in srgb, var(--amber) 35%, var(--edge)); }
.card .head { display: flex; align-items: center; gap: 9px; }
.card h3 { font: 700 16px/1.1 var(--display); margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.statusword { font: 600 10px var(--body); letter-spacing: 0.1em; text-transform: uppercase; flex: none; }
.statusword.red { color: var(--red); } .statusword.amber { color: var(--amber); } .statusword.green { color: var(--faint); }
.card .sum { color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.card .foot { display: flex; gap: 12px; font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; margin-top: 3px; flex-wrap: wrap; }
.card .foot b { color: var(--ink); font-weight: 600; }
/* The top band is physically bigger: taller cards, larger type, its own numbers row. */
.tier1 .card { padding: 18px 20px 16px; gap: 7px; border-radius: 12px; }
.tier1 .card h3 { font-size: 23px; }
.tier1 .card .sum { font-size: 13.5px; }
.tier1 .nums { display: flex; gap: 22px; margin-top: 8px; }
.tier1 .nums .n { display: flex; flex-direction: column; }
.tier1 .nums .v { font: 700 22px var(--display); font-variant-numeric: tabular-nums; }
.tier1 .nums .v.warn { color: var(--amber); } .tier1 .nums .v.bad { color: var(--red); }
.tier1 .nums .k { font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.08em; }
.ovfoot { margin-top: auto; padding-top: 12px; flex: none; color: var(--faint); font-size: 12px; }
.ovfoot a { color: var(--muted); cursor: pointer; text-decoration: underline dotted; }
.ovfoot a:hover { color: var(--ink); }

.dhead { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.dhead h2 { font: 700 36px/1 var(--display); margin: 0; letter-spacing: -0.01em; }
.dhead .meta { color: var(--faint); font-size: 13px; }
.sentence { font-size: 16px; color: var(--muted); margin: 12px 0 0; max-width: 72ch; line-height: 1.55; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-top: 20px; }
.fact { background: var(--card); border: 1px solid var(--edge); border-radius: 10px; padding: 14px 16px; text-align: center; }
.fact .v { font: 700 26px var(--display); font-variant-numeric: tabular-nums; }
.fact .v.warn { color: var(--amber); } .fact .v.bad { color: var(--red); }
.fact .k { font-size: 11px; color: var(--faint); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 3px; }
.actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
.actions button { display: inline-flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--edge); color: var(--ink); font: 500 13.5px var(--body); border-radius: 8px; padding: 10px 16px; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.15s; }
.actions button:hover { background: var(--card-hi); border-color: var(--edge-hi); transform: translateY(-1px); }
.actions svg { width: 15px; height: 15px; stroke: var(--accent); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.actions .ext { color: var(--faint); font-size: 11px; margin-left: 2px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-top: 24px; align-items: start; }
.panel { background: var(--card); border: 1px solid var(--edge); border-radius: 10px; padding: 16px 18px; min-width: 0; }
.panel h4 { font: 700 11.5px var(--body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); margin: 0 0 10px; }
.panel table { width: 100%; border-collapse: collapse; font-size: 14px; }
.panel td { padding: 7px 0; border-top: 1px solid var(--edge); vertical-align: top; }
.panel tr:first-child td { border-top: 0; }
.panel td.v { text-align: right; color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; padding-left: 14px; }
.bar { height: 4px; border-radius: 2px; background: var(--edge); margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); }
.listpane h2 { font: 700 26px var(--display); margin: 0 0 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.card.dashed { border-style: dashed; }
@media (max-width: 860px) { body { flex-direction: column; overflow: auto; } nav { width: auto; } .pane { overflow: visible; } }
@media (prefers-reduced-motion: reduce) { .pane { animation: none; } }
</style>
</head>
<body>
<nav>
	<div class="scroll" id="rail">
		<div class="brand"><h1 id="brand" title="Home: the overview">perch</h1>
			<div class="swatches">
				<button class="sw-ink on" data-palette="" title="Ink palette"></button>
				<button class="sw-graphite" data-palette="graphite" title="Graphite palette"></button>
				<button class="sw-slate" data-palette="slate" title="Slate palette"></button>
			</div>
		</div>
	</div>
	<div class="legend">
		<span title="Failing CI, open bugs or month-long drift"><span class="dot red"></span>attention</span>
		<span title="Uncommitted or unpushed work older than 7 days"><span class="dot amber"></span>drifting</span>
		<span title="Clean, pushed, nothing outstanding"><span class="dot green"></span>settled</span>
		<span title="Found on disk, awaiting a decision"><span class="dot triage"></span>not adopted</span>
		<span title="What your hands are doing, separate from health"><span class="act editing">EDITING</span>&nbsp;activity</span>
	</div>
</nav>
<main><div class="pane" id="pane"></div></main>
<script src="./data.js"></script>
<script>
const { items, scannedAt } = window.PERCH_DATA;
const ago = (d) => d === null ? "—" : d === 0 ? "today" : d === 1 ? "yesterday" : `${d}d ago`;
const adopted = items.filter((i) => i.adopted);
const triage = items.filter((i) => !i.adopted && i.local);
const forgeOnly = items.filter((i) => !i.local);
const rank = { red: 0, amber: 1, green: 2 };

for (const b of document.querySelectorAll(".swatches button")) {
	b.addEventListener("click", () => {
		if (b.dataset.palette) document.documentElement.dataset.palette = b.dataset.palette;
		else delete document.documentElement.dataset.palette;
		for (const x of document.querySelectorAll(".swatches button")) x.classList.toggle("on", x === b);
		try { localStorage.setItem("perch2-palette", b.dataset.palette ?? ""); } catch {}
	});
}
try {
	const saved = localStorage.getItem("perch2-palette");
	if (saved) document.querySelector(`.swatches button[data-palette="${saved}"]`)?.click();
} catch {}

const activityWord = (it) => it.git?.activity === "editing" ? "editing" : it.git?.activity === "in-progress" ? "in flight" : "";
function summary(it) {
	const g = it.git;
	if (!g) return `only on ${it.forges.map((f) => f.forge).join(" and ")}`;
	const bits = [];
	if (g.uncommitted) bits.push(`${g.uncommitted} uncommitted`);
	if (g.unpushed) bits.push(`${g.unpushed} unpushed`);
	if (g.driftDays) bits.push(`drifting ${g.driftDays}d`);
	if (it.work.bugs) bits.push(`${it.work.bugs} bugs`);
	if (g.backup === "no-remote") bits.push("one disk only");
	return bits.length ? bits.join(" · ") : `clean · touched ${ago(it.lastTouchedDays)}`;
}
const sentence = (it) => {
	const s = summary(it).replaceAll(" · ", ", ");
	return (s.charAt(0).toUpperCase() + s.slice(1) + ".").replace("Only on", "Lives only on");
};

const rail = document.getElementById("rail");
const rows = new Map();
function addRow(id, html, cls, onClick, tip) {
	const r = document.createElement("div");
	r.className = `row ${cls}`;
	r.tabIndex = 0;
	if (tip) r.title = tip;
	r.innerHTML = html;
	r.addEventListener("click", onClick);
	r.addEventListener("keydown", (e) => { if (e.key === "Enter") onClick(); });
	rail.appendChild(r);
	rows.set(id, r);
}
addRow("home", `<span class="glyph">◆</span><span class="nm">Overview</span>`, "home", () => showOverview(), "Everything at a glance");
const groups = [
	["Machine & Home", adopted.filter((i) => i.tier === "machine-home"), false],
	["Projects", adopted.filter((i) => i.tier === "projects"), false],
	["Not adopted", triage, true],
	["Forge only", forgeOnly, true],
];
for (const [label, list, dim] of groups) {
	if (!list.length) continue;
	const h = document.createElement("div");
	h.className = "grp";
	h.textContent = `${label} · ${list.length}`;
	rail.appendChild(h);
	for (const it of [...list].sort((a, b) => rank[a.health] - rank[b.health])) {
		addRow(it.id,
			`<span class="dot ${dim ? "triage" : it.health}" title="${dim ? "not adopted" : it.health}"></span><span class="nm">${it.displayName}</span><span class="act ${it.git?.activity === "editing" ? "editing" : ""}">${activityWord(it)}</span>`,
			dim ? "dim" : "", () => showDetail(it), summary(it));
	}
}
const selectRow = (id) => { for (const [k, r] of rows) r.classList.toggle("sel", k === id); };
document.getElementById("brand").addEventListener("click", () => showOverview());

const pane = document.getElementById("pane");
const rerender = (el) => { el.style.animation = "none"; void el.offsetWidth; el.style.animation = ""; };
const ICONS = {
	terminal: `<svg viewBox="0 0 24 24"><path d="M4 17l6-5-6-5"/><path d="M12 19h8"/></svg>`,
	code: `<svg viewBox="0 0 24 24"><path d="M8 6l-6 6 6 6"/><path d="M16 6l6 6-6 6"/></svg>`,
	folder: `<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>`,
	forge: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3.5 9h17M3.5 15h17M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>`,
};

function bigCard(it) {
	const nums = [];
	if (it.git) {
		nums.push([it.git.uncommitted, "dirty", it.git.uncommitted ? "warn" : ""]);
		nums.push([it.git.unpushed, "unpushed", it.git.unpushed ? "warn" : ""]);
		nums.push([it.git.driftDays ?? 0, "drift d", (it.git.driftDays ?? 0) >= 7 ? "warn" : ""]);
	}
	if (it.work.bugs) nums.push([it.work.bugs, "bugs", "bad"]);
	else nums.push([it.work.total, "open", ""]);
	return `<article class="card ${it.health}" data-id="${it.id}" title="${summary(it)}">
		<div class="head"><span class="dot ${it.health}" title="${it.health}"></span><h3>${it.displayName}</h3>
			<span class="statusword ${it.health}">${it.health === "amber" ? "drifting" : it.health === "green" ? "settled" : "attention"}</span></div>
		<div class="sum">${summary(it)}</div>
		<div class="nums">${nums.map((n) => `<span class="n"><span class="v ${n[2]}">${n[0]}</span><span class="k">${n[1]}</span></span>`).join("")}</div></article>`;
}
function smallCard(it, dashed = false) {
	return `<article class="card ${dashed ? "dashed" : it.health}" data-id="${it.id}" title="${summary(it)}">
		<div class="head"><span class="dot ${dashed ? "triage" : it.health}"></span><h3>${it.displayName}</h3></div>
		<div class="sum">${summary(it)}</div>
		<div class="foot">${activityWord(it) ? `<span class="act editing">${activityWord(it).toUpperCase()}</span>` : ""}${it.ci ? `<span>ci <b>${it.ci.conclusion}</b></span>` : ""}</div></article>`;
}
function wire() {
	for (const el of pane.querySelectorAll(".card[data-id]")) {
		el.addEventListener("click", () => showDetail(items.find((i) => i.id === el.dataset.id)));
	}
}
function showOverview() {
	selectRow("home");
	pane.classList.remove("scrolls");
	const tally = { red: 0, amber: 0, green: 0 };
	for (const it of adopted) tally[it.health]++;
	pane.innerHTML = `
		<div class="ovhead"><h2>Overview</h2>
			<div class="totals"><span class="red">${tally.red} attention</span><span class="amber">${tally.amber} drifting</span><span class="green">${tally.green} settled</span></div>
			<div class="scanned">scanned ${new Date(scannedAt).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })} · names and tiers provisional</div></div>
		<div class="bandlabel">Machine &amp; Home</div>
		<div class="tier1">${adopted.filter((i) => i.tier === "machine-home").sort((a, b) => rank[a.health] - rank[b.health]).map(bigCard).join("")}</div>
		<div class="bandlabel">Projects</div>
		<div class="tier2">${adopted.filter((i) => i.tier === "projects").sort((a, b) => rank[a.health] - rank[b.health] || (a.lastTouchedDays ?? 999) - (b.lastTouchedDays ?? 999)).map((it) => smallCard(it)).join("")}</div>
		<div class="ovfoot">Also in the rail: <a id="f-triage">${triage.length} not adopted</a> · <a id="f-forge">${forgeOnly.length} forge only</a> · 14 archived stay hidden</div>`;
	wire();
	pane.querySelector("#f-triage").addEventListener("click", () => showList("Not adopted", triage));
	pane.querySelector("#f-forge").addEventListener("click", () => showList("Forge only", forgeOnly));
	rerender(pane);
}
function showDetail(it) {
	selectRow(it.id);
	pane.classList.add("scrolls");
	const row = (k, v) => `<tr><td>${k}</td><td class="v">${v}</td></tr>`;
	const facts = [];
	if (it.git) {
		facts.push([it.git.uncommitted, "uncommitted", it.git.uncommitted ? "warn" : ""]);
		facts.push([it.git.unpushed, "unpushed", it.git.unpushed ? "warn" : ""]);
		facts.push([it.git.driftDays ?? 0, "days drift", (it.git.driftDays ?? 0) >= 7 ? "warn" : ""]);
	}
	facts.push([it.work.bugs, "bugs", it.work.bugs ? "bad" : ""]);
	facts.push([it.work.total - it.work.bugs, "open items", ""]);
	if (it.ci) facts.push([it.ci.conclusion, "latest ci", it.ci.conclusion === "failure" ? "bad" : ""]);
	const panels = [];
	if (it.git?.branches?.length) panels.push(`<div class="panel"><h4>Branches</h4><table>${it.git.branches.map((b) => row(`<b>${b.name}</b><br><span style="color:var(--muted)">${b.subject ?? ""}</span>`, ago(b.daysAgo))).join("")}</table></div>`);
	if (it.groups.length) panels.push(`<div class="panel"><h4>Roadmap</h4><table>${it.groups.map((g) => {
		const pct = g.done ? Math.round((g.done / g.items) * 100) : null;
		return row(`${g.heading}${pct !== null ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ""}`, g.done ? `${g.done}/${g.items}` : `${g.items}`);
	}).join("")}</table></div>`);
	if (it.finalised.length) panels.push(`<div class="panel"><h4>Finalised on ${it.finalised[0].forge}</h4><table>${it.finalised.map((c) => row(c.subject, c.at ? c.at.slice(0, 10) : "")).join("")}</table></div>`);
	if (it.flags.length) panels.push(`<div class="panel"><h4>Flags</h4><table>${it.flags.map((f) => row(f.detail ?? f.flag, f.level)).join("")}</table></div>`);
	const act = (icon, label) => `<button title="Opens outside perch">${ICONS[icon]}${label}<span class="ext">↗</span></button>`;
	pane.innerHTML = `
		<div class="dhead"><h2>${it.displayName}</h2>
			<span class="statusword ${it.adopted ? it.health : ""}" style="font-size:12px">${it.adopted ? it.health : "not adopted"}</span>
			${activityWord(it) ? `<span class="act editing" style="font-size:11px">${activityWord(it).toUpperCase()}</span>` : ""}
			<span class="meta">${it.id} · ${it.forges.map((f) => f.fullName).join(" + ") || "no forge"} · last session ${ago(it.lastSessionDays)}</span></div>
		<p class="sentence">${sentence(it)}</p>
		<div class="facts">${facts.map((f) => `<div class="fact"><div class="v ${f[2]}">${f[0]}</div><div class="k">${f[1]}</div></div>`).join("")}</div>
		<div class="actions">${act("terminal", "zellij tab")}${act("code", "VS Code")}${act("folder", "Files")}${it.forges.map((f) => act("forge", f.forge)).join("")}</div>
		<div class="cols">${panels.join("")}</div>`;
	rerender(pane);
}
function showList(title, list) {
	selectRow(null);
	pane.classList.add("scrolls");
	pane.innerHTML = `<div class="listpane"><h2>${title}</h2><div class="grid">${list.map((it) => smallCard(it, true)).join("")}</div></div>`;
	wire();
	rerender(pane);
}
window.addEventListener("keydown", (e) => { if (e.key === "Escape") showOverview(); });
showOverview();
</script>
</body>
</html>
