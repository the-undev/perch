<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Shelf</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;600&display=swap">
<style>
/* Layout: cards on a desk. Attention sets card size; the card itself expands
   into the detail view. Dark desk, stone cards, by choice. */
:root {
	--desk: #191511;
	--desk-edge: #221d17;
	--card: #ece5d7;
	--card-2: #e2dac9;
	--ink: #272118;
	--muted: #6e6557;
	--green: #2c7a4b;
	--amber: #9a6a07;
	--red: #b2362c;
	--display: "Bricolage Grotesque", system-ui, sans-serif;
	--body: "Figtree", system-ui, sans-serif;
	color-scheme: dark;
}
* { box-sizing: border-box; }
body {
	margin: 0;
	background: radial-gradient(1200px 500px at 30% -10%, var(--desk-edge), var(--desk));
	color: var(--card);
	font-family: var(--body);
	font-size: 14px;
	min-height: 100vh;
	padding-block: 0 48px;
	padding-left: max(16px, env(safe-area-inset-left, 0px));
	padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header { padding-block: 26px 6px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; }
header h1 { font: 700 clamp(26px, 4vw, 38px)/1 var(--display); margin: 0; letter-spacing: -0.015em; }
header .sum { color: #9b9078; font-size: 13px; }
header .sum b { color: var(--card); font-weight: 600; }

.board {
	display: grid;
	grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
	grid-auto-rows: 118px;
	grid-auto-flow: dense;
	gap: 14px;
	padding-block: 18px 0;
}
.card {
	position: relative;
	background: linear-gradient(170deg, var(--card), var(--card-2));
	color: var(--ink);
	border-radius: 10px;
	padding: 14px 15px 12px;
	cursor: pointer;
	box-shadow: 0 2px 3px rgb(0 0 0 / 0.35), 0 10px 22px -12px rgb(0 0 0 / 0.6);
	border-bottom: 5px solid var(--edge, #b9b09c);
	overflow: hidden;
	display: flex;
	flex-direction: column;
	opacity: 0;
	transform: translateY(14px) rotate(-0.4deg);
	animation: deal 0.5s cubic-bezier(0.22, 0.9, 0.3, 1.1) forwards;
	animation-delay: var(--d);
	transition: transform 0.22s cubic-bezier(0.22, 0.9, 0.3, 1.4), box-shadow 0.22s;
}
.card:hover, .card:focus-visible {
	transform: translateY(-4px) rotate(0.3deg);
	box-shadow: 0 4px 6px rgb(0 0 0 / 0.3), 0 24px 36px -16px rgb(0 0 0 / 0.65);
	outline: none;
}
@keyframes deal { to { opacity: 1; transform: none; } }
.card.red { --edge: var(--red); grid-column: span 2; grid-row: span 2; }
.card.amber { --edge: var(--amber); grid-row: span 2; }
.card.green { --edge: var(--green); }
.card h2 { margin: 0; font: 700 18px/1.1 var(--display); letter-spacing: -0.01em; overflow-wrap: anywhere; }
.card.red h2 { font-size: 24px; }
.card .meta { margin-top: 4px; font-size: 11.5px; color: var(--muted); }
.card .body { margin-top: auto; display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; }
.card .line { display: flex; justify-content: space-between; gap: 10px; }
.card .line .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.badge {
	position: absolute; top: 12px; right: 12px;
	font: 600 10px/1 var(--body); letter-spacing: 0.08em; text-transform: uppercase;
	color: var(--edge-ink, var(--muted));
	border: 1.5px solid var(--edge, #b9b09c);
	border-radius: 999px; padding: 4px 8px;
}
.card.red .badge { color: var(--red); }
.card.amber .badge { color: var(--amber); }
.card.green .badge { color: var(--green); }
.work { display: flex; gap: 8px; margin-top: 7px; flex-wrap: wrap; }
.work span { font-size: 11px; font-weight: 600; color: var(--muted); }
.work .bugs { color: var(--red); }

/* Expanded card */
#detail {
	position: fixed; inset: 0; z-index: 10; display: none;
	background: rgb(12 10 7 / 0.55);
	align-items: center; justify-content: center;
	padding: 4vh max(16px, env(safe-area-inset-left, 0px));
}
#detail.show { display: flex; }
#detail .sheet {
	background: linear-gradient(170deg, var(--card), var(--card-2));
	color: var(--ink);
	border-radius: 14px;
	border-bottom: 7px solid var(--edge, #b9b09c);
	width: min(680px, 100%);
	max-height: 90vh;
	overflow-y: auto;
	padding: 28px 30px 30px;
	box-shadow: 0 40px 80px -20px rgb(0 0 0 / 0.8);
	transform-origin: var(--ox) var(--oy);
	animation: grow 0.3s cubic-bezier(0.24, 0.9, 0.32, 1.1);
}
@keyframes grow { from { transform: scale(0.42); opacity: 0.4; } }
#detail h2 { font: 700 30px/1.05 var(--display); margin: 0; }
#detail .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
#detail h3 { font: 700 13px var(--display); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin: 24px 0 8px; }
#detail table { width: 100%; border-collapse: collapse; font-size: 13px; }
#detail td { padding: 5px 0; border-top: 1px solid rgb(39 33 24 / 0.12); vertical-align: top; }
#detail td.v { text-align: right; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; padding-left: 14px; }
.statusword { font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px; }
.statusword.red { color: var(--red); } .statusword.amber { color: var(--amber); } .statusword.green { color: var(--green); }
@media (prefers-reduced-motion: reduce) {
	.card { animation: none; opacity: 1; transform: none; transition: none; }
	#detail .sheet { animation: none; }
}
@media (max-width: 480px) { .card.red { grid-column: span 1; } }
</style>
</head>
<body>
<header>
	<h1>The Shelf</h1>
	<div class="sum" id="sum"></div>
</header>
<main class="board" id="board"></main>
<div id="detail"><div class="sheet" id="sheet"></div></div>
<script src="./data.js"></script>
<script>
const { items, scannedAt } = window.PERCH_DATA;
const ago = (d) => d === null ? "—" : d === 0 ? "today" : `${d}d ago`;

const counts = { red: 0, amber: 0, green: 0 };
for (const it of items) counts[it.health]++;
document.getElementById("sum").innerHTML =
	`<b>${counts.red}</b> need attention · <b>${counts.amber}</b> drifting · <b>${counts.green}</b> settled · scanned ${new Date(scannedAt).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}`;

const board = document.getElementById("board");
items.forEach((it, i) => {
	const c = document.createElement("article");
	c.className = `card ${it.health}`;
	c.tabIndex = 0;
	c.style.setProperty("--d", `${Math.min(i * 40, 800)}ms`);
	const g = it.git;
	const lines = [];
	if (g) {
		if (g.uncommitted) lines.push(["Uncommitted", g.uncommitted]);
		if (g.unpushed) lines.push(["Unpushed", g.unpushed]);
		if (g.driftDays !== null) lines.push(["Drifting", `${g.driftDays}d`]);
		if (!lines.length) lines.push(["Clean on", g.branch]);
	} else {
		lines.push(["Forge only", it.forges.map((f) => f.forge).join(", ")]);
	}
	const work = [];
	if (it.work.bugs) work.push(`<span class="bugs">${it.work.bugs} bugs</span>`);
	if (it.work.total - it.work.bugs) work.push(`<span>${it.work.total - it.work.bugs} open items</span>`);
	c.innerHTML = `
		<span class="badge">${it.health === "red" ? "attend" : it.health === "amber" ? "drifting" : "settled"}</span>
		<h2>${it.name}</h2>
		<div class="meta">${g ? `${g.activity} · touched ${ago(it.lastTouchedDays)}` : "no local copy"}</div>
		<div class="body">
			${lines.slice(0, it.health === "red" ? 4 : 2).map((l) => `<div class="line"><span>${l[0]}</span><span class="v">${l[1]}</span></div>`).join("")}
			${work.length && it.health !== "green" ? `<div class="work">${work.join("")}</div>` : ""}
		</div>`;
	const open = (ev) => openDetail(it, c);
	c.addEventListener("click", open);
	c.addEventListener("keydown", (e) => { if (e.key === "Enter") open(); });
	board.appendChild(c);
});

const detail = document.getElementById("detail");
const sheet = document.getElementById("sheet");
function openDetail(it, fromCard) {
	const r = fromCard.getBoundingClientRect();
	sheet.style.setProperty("--ox", `${r.left + r.width / 2}px`);
	sheet.style.setProperty("--oy", `${r.top + r.height / 2}px`);
	sheet.style.setProperty("--edge", getComputedStyle(fromCard).borderBottomColor);
	const row = (k, v) => `<tr><td>${k}</td><td class="v">${v}</td></tr>`;
	let html = `<h2>${it.name}</h2>
		<div class="sub">${it.id} · <span class="statusword ${it.health}">${it.health}</span>
		 · ${it.forges.map((f) => f.fullName).join(" + ") || "no forge"}
		 · last session ${ago(it.lastSessionDays)}</div>`;
	if (it.git) html += `<h3>Branches</h3><table>${it.git.branches.map((b) => row(`<b>${b.name}</b> ${b.subject ?? ""}`, ago(b.daysAgo))).join("")}</table>`;
	if (it.groups.length) html += `<h3>Roadmap</h3><table>${it.groups.map((gr) => row(gr.heading, gr.done ? `${gr.done} of ${gr.items} done` : `${gr.items} open`)).join("")}</table>`;
	if (it.finalised.length) html += `<h3>Finalised</h3><table>${it.finalised.map((cm) => row(cm.subject, cm.at ? cm.at.slice(0, 10) : "")).join("")}</table>`;
	if (it.flags.length) html += `<h3>Flags</h3><table>${it.flags.map((f) => row(f.detail ?? f.flag, f.level)).join("")}</table>`;
	sheet.innerHTML = html;
	detail.classList.add("show");
}
detail.addEventListener("click", (e) => { if (e.target === detail) detail.classList.remove("show"); });
window.addEventListener("keydown", (e) => { if (e.key === "Escape") detail.classList.remove("show"); });
</script>
</body>
</html>
