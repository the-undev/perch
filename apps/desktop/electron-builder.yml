appId: com.github.finch.perch
productName: perch
directories:
  output: dist
files:
  - out/**
  - package.json
extraResources:
  # The window's and the tray's icons, found where the dev build finds them in resources/.
  - from: resources
    to: .
    filter:
      - icons/*.png
      - tray*.png
linux:
  target: AppImage
  category: Development
  executableName: perch
  syncDesktopName: true
  icon: resources/icons
artifactName: ${productName}-${version}-${arch}.${ext}
