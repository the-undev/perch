# perch configuration: a reference showing every field, with placeholder
# values.
#
# The live copy is ~/.config/perch/config.toml. The app writes a starter
# there when asked: one wire, the standard windows, no sources. The command
# line scanner runs with those defaults when the live copy does not exist.
# The app writes the file back without comments. No secrets here: tokens
# come from the desktop keyring at run time.
#
# Config asserts only what leaves no trace on disk or on a forge. When an
# assertion and an observation disagree, the observation wins and the
# disagreement is flagged.
#
# A presence is named local:<id>, github:<owner>/<name> or
# forgejo:<owner>/<name>. A local id is the path relative to the home
# directory.

# Presences that are one project although no remote URL proves it, for
# example [["github:someone/notes", "forgejo:someone/notes"]].
joins = []

# Presences to leave off the main view. They still appear in their forge's
# listing.
ignore = []

# The wires, top to bottom: the owner's priority bands. An adopted item
# sits on the wire its entry names, else the default. Everything config does
# not name sits on the fence beneath.
[wires]
names = ["Home", "Projects"]
default = "Projects"

# Sources: one table per connection, repeated for each. Nothing is assumed:
# a config with no sources is valid and scans nothing.

# A local source. Each include is a repository, or a directory searched for
# repositories. Nothing at or below an exclude is searched.
[[sources.local]]
include = ["~/projects"]
exclude = ["~/projects/archive"]

# A GitHub account lists the repositories it owns, read with its own
# read-only token from the keyring (secret-tool, service perch, the key named
# here; see docs/tokens.md). A remote that no listing holds is looked up with
# the token of the account that owns it on that host. Hosts are the remote
# hosts and SSH aliases that reach the account. Forks to track are written
# owner/name; every other fork is skipped. Each account appears once.
[[sources.github]]
account = "someone"
key = "github-someone"
hosts = ["github.com"]
tracked_forks = []

# A Forgejo account adds the instance's base URL. Each account appears once
# per instance.
[[sources.forgejo]]
base_url = "https://forge.example.lan"
account = "someone"
key = "forgejo-someone"
hosts = ["forge.example.lan"]
tracked_forks = []

# An Uptime Kuma status page, monitored as the server it names. Each name
# appears once.
# [[sources.kuma]]
# name = "Server"
# base_url = "http://kuma.example.lan:3001"
# status_page = "status"

# Health windows: amber at the first, red at the second. Unsafe work
# (uncommitted changes, unpushed commits) ages in hours from its oldest
# change. Stalled flight, parked on a non-default branch with no new commit,
# ages in days, as does an expectation below that reality does not meet,
# from when a scan first saw it unmet. Each is overridable per item with the
# same keys.
[thresholds]
unsafe_amber_hours = 24
unsafe_red_hours = 72
stalled_amber_days = 7
stalled_red_days = 30
expectation_amber_days = 7
expectation_red_days = 30

# Everything is scanned on the interval, counted from the end of the last
# scan.
[scan]
interval_minutes = 15
# Commits on each forge repository's default branch to read as finalised.
finalised_commits = 10

# The zellij session that holds a project's terminal tab: the item's own
# zellij_session, else the session of the longest root containing the project
# in a [launch.zellij_sessions] table of roots and sessions, such as
# "~/work" = "work", else zellij_session here.
[launch]
zellij_session = "main"

# The commands behind the launch actions, each an argument list run without
# a shell. Placeholders in braces are filled in at launch. Leave a command
# out and its action is not offered.
[launch.commands]
# zellij itself. perch finds the session's tab named after the project and
# goes to it, or opens one in the project's directory.
zellij = ["zellij"]
# Opens a terminal on a session that is not running: {session}, and {cwd}
# the project's directory. Needed with zellij for the zellij tab.
terminal = ["alacritty", "--working-directory", "{cwd}", "-e", "zellij", "attach", "-c", "{session}"]
# {path} is the project's directory.
vscode = ["code", "{path}"]
folder = ["dolphin", "{path}"]
# {vault} is the vault's folder name, encoded for a URI.
obsidian = ["xdg-open", "obsidian://open?vault={vault}"]

# Item entries. An entry adopts the bird and puts it on a wire. Its key names
# any presence of the item: a local id, or a forge presence such as
# "forgejo:owner/name", which still applies once a local clone joins it. When
# two entries name one item, the one keyed by the item's id applies and the
# clash is flagged. A repository found inside an include directory is flagged
# as not set up until it has an entry here, even an empty one.
#
# Every field an entry can hold, each optional:
# [items."projects/example"]
# wire = "Projects"                  # one of wires.names
# name = "Example"                   # the bird's name; default the folder or repository name
# key_files = ["README.md", "docs/spec.md", "docs/roadmap.md"]  # default the README and roadmaps
# roadmaps = ["docs/roadmap.md"]     # replaces the standard roadmap names
# zellij_session = "main"
# unsafe_amber_hours = 12
# unsafe_red_hours = 48
# stalled_amber_days = 14
# stalled_red_days = 60
# expectation_amber_days = 3
# expectation_red_days = 14
