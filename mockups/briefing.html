<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morning Briefing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Libre+Franklin:wght@400;600;700&display=swap">
<style>
/* Layout: a morning paper. Masthead, a ranked lead column of what needs
   attention, then the quieter sections. Light, print-like, by choice. */
:root {
	--paper: #f7f5f0;
	--ink: #1d1c1a;
	--muted: #6d6a63;
	--rule: #d9d5cb;
	--green: #2d6a45;
	--amber: #8a5f05;
	--red: #a92f25;
	--serif: "Newsreader", Georgia, serif;
	--sans: "Libre Franklin", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
	margin: 0;
	background: var(--paper);
	color: var(--ink);
	font-family: var(--serif);
	font-size: 15px;
	padding-block: 0 60px;
	padding-left: max(16px, env(safe-area-inset-left, 0px));
	padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet { max-width: 1060px; margin: 0 auto; }
.masthead { text-align: center; padding-block: 30px 12px; border-bottom: 3px double var(--ink); }
.masthead h1 { font: 600 clamp(34px, 5vw, 52px)/1 var(--serif); letter-spacing: 0.02em; margin: 0; }
.masthead .dateline {
	display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
	font: 600 10.5px var(--sans); letter-spacing: 0.14em; text-transform: uppercase;
	color: var(--muted); margin-top: 14px;
}
.lead { padding-block: 26px 10px; }
.kicker { font: 700 11px var(--sans); letter-spacing: 0.18em; text-transform: uppercase; margin: 0 0 14px; }
.kicker.red { color: var(--red); } .kicker.amber { color: var(--amber); } .kicker.green { color: var(--green); } .kicker.plain { color: var(--muted); }
.story {
	display: grid; grid-template-columns: 34px 1fr auto; gap: 4px 14px;
	padding-block: 11px; border-top: 1px solid var(--rule);
	opacity: 0; animation: settle 0.5s ease forwards; animation-delay: var(--d);
	cursor: pointer;
}
@keyframes settle { from { transform: translateY(5px); } to { opacity: 1; } }
.story .rank { font: 400 22px/1.1 var(--serif); color: var(--muted); font-variant-numeric: tabular-nums; }
.story h2 { font: 600 20px/1.15 var(--serif); margin: 0; }
.story h2 .tag { font: 600 10px var(--sans); letter-spacing: 0.1em; text-transform: uppercase; vertical-align: 2px; margin-left: 10px; }
.tag.red { color: var(--red); } .tag.amber { color: var(--amber); } .tag.green { color: var(--green); }
.story .sum { grid-column: 2; font: italic 400 15px/1.45 var(--serif); color: var(--muted); max-width: 62ch; }
.story .when { font: 600 10.5px var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); align-self: start; padding-top: 6px; white-space: nowrap; }
.story .more { grid-column: 2; display: none; margin-top: 8px; font-size: 14px; }
.story.open .more { display: block; }
.more table { border-collapse: collapse; width: 100%; max-width: 560px; font-family: var(--sans); font-size: 12.5px; }
.more td { border-top: 1px dotted var(--rule); padding: 4px 0; }
.more td.v { text-align: right; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; padding-left: 16px; }
.more h4 { font: 700 10px var(--sans); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin: 12px 0 4px; }

.columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 0 44px; border-top: 3px double var(--ink); margin-top: 26px; padding-top: 20px; }
.columns section { min-width: 0; }
.brief { padding-block: 8px; border-top: 1px solid var(--rule); }
.brief:first-of-type { border-top: 0; }
.brief .name { font: 600 15.5px var(--serif); }
.brief .note { font: 400 13px/1.4 var(--serif); color: var(--muted); font-style: italic; }
footer { text-align: center; font: italic 400 13px var(--serif); color: var(--muted); border-top: 1px solid var(--rule); margin-top: 36px; padding-top: 14px; }
@media (prefers-reduced-motion: reduce) { .story { animation: none; opacity: 1; } }
</style>
</head>
<body>
<div class="sheet">
	<header class="masthead">
		<h1>The Perch Briefing</h1>
		<div class="dateline"><span id="edition"></span><span id="date"></span><span id="counts"></span></div>
	</header>
	<section class="lead">
		<p class="kicker red">Needs attention</p>
		<div id="lead"></div>
	</section>
	<div class="columns">
		<section><p class="kicker amber">Drifting</p><div id="amber"></div></section>
		<section><p class="kicker green">Settled</p><div id="green"></div></section>
		<section><p class="kicker plain">Elsewhere</p><div id="elsewhere"></div></section>
	</div>
	<footer>Derived entirely from the machine. Nothing here was typed in.</footer>
</div>
<script src="./data.js"></script>
<script>
const { items, scannedAt } = window.PERCH_DATA;
const when = new Date(scannedAt);
document.getElementById("date").textContent = when.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
document.getElementById("edition").textContent = `Scanned ${when.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}`;
const tally = { red: 0, amber: 0, green: 0 };
for (const it of items) tally[it.health]++;
document.getElementById("counts").textContent = `${tally.red} urgent · ${tally.amber} drifting · ${tally.green} settled`;

const ago = (d) => d === null ? "" : d === 0 ? "today" : d === 1 ? "yesterday" : `${d} days ago`;

function sentence(it) {
	const g = it.git;
	const parts = [];
	if (!g) return `Lives only on ${it.forges.map((f) => f.forge).join(" and ")}, with no copy on this machine.`;
	if (g.uncommitted) parts.push(`${g.uncommitted} file${g.uncommitted > 1 ? "s" : ""} sit uncommitted`);
	if (g.unpushed) parts.push(`${g.unpushed} commit${g.unpushed > 1 ? "s" : ""} unpushed`);
	if (g.driftDays !== null && g.driftDays > 0) parts.push(`drifting ${g.driftDays} days`);
	if (g.backup === "no-remote") parts.push("and it exists on one disk only");
	let s = parts.length ? parts.join(", ") : `clean on ${g.branch}`;
	if (it.work.bugs) s += `; ${it.work.bugs} bug${it.work.bugs > 1 ? "s" : ""} on the roadmap`;
	else if (it.work.total) s += `; ${it.work.total} items parked`;
	const flag = it.flags.find((f) => f.flag !== "not-set-up");
	if (flag) s += `; ${flag.flag.replaceAll("-", " ")}`;
	return s.charAt(0).toUpperCase() + s.slice(1) + ".";
}

const lead = document.getElementById("lead");
const reds = items.filter((i) => i.health === "red");
reds.forEach((it, i) => {
	const el = document.createElement("article");
	el.className = "story";
	el.style.setProperty("--d", `${i * 60}ms`);
	el.innerHTML = `
		<div class="rank">${i + 1}</div>
		<h2>${it.name}<span class="tag ${it.health}">${it.health}</span></h2>
		<div class="when">${ago(it.lastTouchedDays)}</div>
		<p class="sum">${sentence(it)}</p>
		<div class="more">${moreHtml(it)}</div>`;
	el.addEventListener("click", () => el.classList.toggle("open"));
	lead.appendChild(el);
});

function moreHtml(it) {
	const row = (k, v) => `<tr><td>${k}</td><td class="v">${v}</td></tr>`;
	let h = "";
	if (it.git?.branches?.length) h += `<h4>Branches</h4><table>${it.git.branches.map((b) => row(`${b.name} — ${b.subject ?? ""}`, ago(b.daysAgo))).join("")}</table>`;
	if (it.groups.length) h += `<h4>Roadmap</h4><table>${it.groups.map((g) => row(g.heading, g.done ? `${g.done} of ${g.items} done` : `${g.items} open`)).join("")}</table>`;
	if (it.finalised.length) h += `<h4>Recently finalised</h4><table>${it.finalised.map((c) => row(c.subject, c.at ? c.at.slice(0, 10) : "")).join("")}</table>`;
	return h || "<p class='sum'>Nothing further on record.</p>";
}

function brief(it) {
	return `<div class="brief"><span class="name">${it.name}</span> — <span class="note">${sentence(it)}</span></div>`;
}
document.getElementById("amber").innerHTML = items.filter((i) => i.health === "amber").map(brief).join("") || "<div class='brief'><span class='note'>Nothing is drifting.</span></div>";
document.getElementById("green").innerHTML = items.filter((i) => i.health === "green" && i.local).map(brief).join("") || "<div class='brief'><span class='note'>Nothing is settled. Busy times.</span></div>";
document.getElementById("elsewhere").innerHTML = items.filter((i) => !i.local).map(brief).join("") || "<div class='brief'><span class='note'>Every forge repo has a local copy.</span></div>";
</script>
</body>
</html>
