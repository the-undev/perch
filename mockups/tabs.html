<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perch Tabs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: centred tabs, one per category, with a dashboard tab first.
   Warm dark material shared with the other round-two mockups. */
:root {
	--bg: #16120e;
	--band: #1c1712;
	--card: #241e17;
	--card-hi: #2b241b;
	--edge: #372d22;
	--ink: #ece4d4;
	--muted: #a2957f;
	--faint: #6d6252;
	--green: #63bd84;
	--amber: #dca743;
	--red: #e25c4d;
	--display: "Bricolage Grotesque", system-ui, sans-serif;
	--body: "Figtree", system-ui, sans-serif;
	color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
	margin: 0; background: var(--bg); color: var(--ink);
	font-family: var(--body); font-size: 14px;
	display: flex; flex-direction: column; overflow: hidden;
	padding-left: max(20px, env(safe-area-inset-left, 0px));
	padding-right: max(20px, env(safe-area-inset-right, 0px));
}
header { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding-block: 16px 0; }
header .brand { font: 700 18px var(--display); }
header .scanned { text-align: right; color: var(--faint); font-size: 12px; }
.tabs { position: relative; display: flex; gap: 4px; background: var(--band); border: 1px solid var(--edge); border-radius: 999px; padding: 4px; }
.tabs button {
	position: relative; z-index: 1;
	background: none; border: 0; color: var(--muted);
	font: 600 13px var(--body); padding: 8px 18px; border-radius: 999px; cursor: pointer;
	transition: color 0.2s;
	display: inline-flex; align-items: center; gap: 7px;
}
.tabs button.on { color: var(--ink); }
.tabs .pill {
	position: absolute; top: 4px; bottom: 4px; z-index: 0;
	background: var(--card-hi); border: 1px solid #4a3d2d; border-radius: 999px;
	transition: left 0.28s cubic-bezier(0.3, 0.9, 0.3, 1), width 0.28s cubic-bezier(0.3, 0.9, 0.3, 1);
}
.tabs .cnt { font-size: 10px; color: var(--faint); }
.tabs .cnt.red { color: var(--red); } .tabs .cnt.amber { color: var(--amber); }

main { flex: 1; min-height: 0; overflow-y: auto; padding-block: 20px 30px; }
.view { animation: slide 0.25s ease; }
@keyframes slide { from { opacity: 0; transform: translateY(6px); } }

/* Dashboard tab */
.dashrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 20px; }
.big {
	background: var(--band); border: 1px solid var(--edge); border-radius: 10px;
	padding: 16px 18px; cursor: pointer; transition: border-color 0.15s;
}
.big:hover { border-color: #4a3d2d; }
.big .v { font: 700 34px/1 var(--display); font-variant-numeric: tabular-nums; }
.big .v.red { color: var(--red); } .big .v.amber { color: var(--amber); } .big .v.green { color: var(--green); } .big .v.dim { color: var(--muted); }
.big .k { color: var(--faint); font-size: 12px; margin-top: 5px; letter-spacing: 0.06em; text-transform: uppercase; }
.attn h3, .catview h3 { font: 700 11px var(--body); letter-spacing: 0.16em; text-transform: uppercase; color: var(--faint); margin: 4px 0 10px; }
.attnrow {
	display: flex; align-items: baseline; gap: 14px;
	background: var(--card); border: 1px solid var(--edge); border-radius: 8px;
	padding: 11px 15px; margin-bottom: 8px; cursor: default; flex-wrap: wrap;
}
.attnrow .nm { font: 700 16px var(--display); }
.attnrow .why { color: var(--muted); font-size: 13px; flex: 1; min-width: 200px; }
.attnrow .cat { color: var(--faint); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; align-self: center; }
.dot.red { background: var(--red); } .dot.amber { background: var(--amber); } .dot.green { background: var(--green); }

/* Category tabs */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.card {
	background: linear-gradient(170deg, var(--card), var(--band));
	border: 1px solid var(--edge); border-radius: 9px; padding: 14px 16px;
	display: flex; flex-direction: column; gap: 5px; transition: border-color 0.15s, background 0.15s;
}
.card:hover { border-color: #4a3d2d; background: var(--card-hi); }
.card .head { display: flex; align-items: center; gap: 9px; }
.card h2 { font: 700 17px/1.1 var(--display); margin: 0; flex: 1; }
.statusword { font: 600 10px var(--body); letter-spacing: 0.1em; text-transform: uppercase; }
.statusword.red { color: var(--red); } .statusword.amber { color: var(--amber); } .statusword.green { color: var(--faint); }
.card .sum { color: var(--muted); font-size: 12.5px; line-height: 1.5; }
.card .foot { display: flex; gap: 14px; color: var(--faint); font-size: 11.5px; font-variant-numeric: tabular-nums; margin-top: 4px; }
.card .foot b { color: var(--ink); }
.triagecard { opacity: 0.75; border-style: dashed; }
@media (prefers-reduced-motion: reduce) { .view { animation: none; } .tabs .pill { transition: none; } }
@media (max-width: 800px) { header { grid-template-columns: 1fr; justify-items: center; } header .scanned { text-align: center; } body { overflow: auto; } }
</style>
</head>
<body>
<header>
	<div class="brand">perch</div>
	<nav class="tabs" id="tabs"><span class="pill" id="pill"></span></nav>
	<div class="scanned" id="scanned"></div>
</header>
<main id="main"></main>
<script src="./data.js"></script>
<script>
const { items, scannedAt } = window.PERCH_DATA;
const ago = (d) => d === null ? "—" : d === 0 ? "today" : d === 1 ? "yesterday" : `${d}d ago`;
document.getElementById("scanned").textContent =
	`scanned ${new Date(scannedAt).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}`;

function summary(it) {
	const g = it.git;
	if (!g) return `only on ${it.forges.map((f) => f.forge).join(" and ")}`;
	const bits = [];
	if (g.uncommitted) bits.push(`${g.uncommitted} uncommitted`);
	if (g.unpushed) bits.push(`${g.unpushed} unpushed`);
	if (g.driftDays) bits.push(`drifting ${g.driftDays}d`);
	if (it.work.bugs) bits.push(`${it.work.bugs} bugs`);
	if (g.backup === "no-remote") bits.push("one disk only");
	return bits.length ? bits.join(" · ") : `clean · touched ${ago(it.lastTouchedDays)}`;
}

const cats = ["Machine", "Tech", "Personal", "Projects"];
const byCat = (c) => items.filter((i) => i.category === c);
const triage = items.filter((i) => !i.adopted && i.local);
const forgeOnly = items.filter((i) => !i.local);
const adopted = items.filter((i) => i.adopted);

const tabsEl = document.getElementById("tabs");
const pill = document.getElementById("pill");
const views = ["Dashboard", ...cats, "Inbox"];
const btns = new Map();
for (const v of views) {
	const b = document.createElement("button");
	const bad = v === "Dashboard" ? adopted.filter((i) => i.health === "red").length
		: v === "Inbox" ? triage.length + forgeOnly.length
		: byCat(v).filter((i) => i.health === "red").length;
	const amber = v !== "Dashboard" && v !== "Inbox" ? byCat(v).filter((i) => i.health === "amber").length : 0;
	b.innerHTML = `${v}${bad ? ` <span class="cnt red">${bad}</span>` : amber ? ` <span class="cnt amber">${amber}</span>` : ""}`;
	b.addEventListener("click", () => show(v));
	tabsEl.appendChild(b);
	btns.set(v, b);
}
function movePill(b) {
	pill.style.left = `${b.offsetLeft}px`;
	pill.style.width = `${b.offsetWidth}px`;
}

const main = document.getElementById("main");
function cardHtml(it, triageCard = false) {
	return `<article class="card ${triageCard ? "triagecard" : ""}">
		<div class="head"><span class="dot ${it.health}"></span><h2>${it.name}</h2>
		<span class="statusword ${it.health}">${triageCard ? "not adopted" : it.health === "amber" ? "drifting" : it.health === "green" ? "settled" : "red"}</span></div>
		<div class="sum">${summary(it)}</div>
		<div class="foot">
			${it.git ? `<span><b>${it.git.branch}</b></span>` : ""}
			${it.work.total ? `<span><b>${it.work.total}</b> open</span>` : ""}
			${it.ci ? `<span>ci <b>${it.ci.conclusion}</b></span>` : ""}
			<span>session <b>${ago(it.lastSessionDays)}</b></span>
		</div></article>`;
}
function show(v) {
	for (const [name, b] of btns) b.classList.toggle("on", name === v);
	movePill(btns.get(v));
	let html = "";
	if (v === "Dashboard") {
		const tally = { red: 0, amber: 0, green: 0 };
		for (const it of adopted) tally[it.health]++;
		html = `<div class="dashrow">
			<div class="big"><div class="v red">${tally.red}</div><div class="k">need attention</div></div>
			<div class="big"><div class="v amber">${tally.amber}</div><div class="k">drifting</div></div>
			<div class="big"><div class="v green">${tally.green}</div><div class="k">settled</div></div>
			<div class="big"><div class="v dim">${triage.length + forgeOnly.length}</div><div class="k">in the inbox</div></div>
		</div>
		<div class="attn"><h3>On the agenda</h3>
		${adopted.filter((i) => i.health !== "green")
			.map((it) => `<div class="attnrow"><span class="dot ${it.health}"></span><span class="nm">${it.name}</span><span class="why">${summary(it)}</span><span class="cat">${it.category}</span></div>`)
			.join("") || "<div class='attnrow'><span class='why'>Everything adopted is settled.</span></div>"}
		</div>`;
	} else if (v === "Inbox") {
		html = `<div class="catview"><h3>Found on disk, not adopted (${triage.length})</h3><div class="grid">${triage.map((t) => cardHtml(t, true)).join("")}</div>
			<h3 style="margin-top:22px">On a forge, no local copy (${forgeOnly.length})</h3><div class="grid">${forgeOnly.map((t) => cardHtml(t, true)).join("")}</div></div>`;
	} else {
		const list = byCat(v);
		html = `<div class="catview"><h3>${v} (${list.length})</h3><div class="grid">${list.map((t) => cardHtml(t)).join("")}</div></div>`;
	}
	main.innerHTML = `<div class="view">${html}</div>`;
}
show("Dashboard");
addEventListener("resize", () => movePill(document.querySelector(".tabs button.on")));
</script>
</body>
</html>
