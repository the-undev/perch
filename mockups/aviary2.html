<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Aviary II</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500&display=swap">
<style>
/* Aviary, second pass. The layout is computed from the real window and
   redrawn on resize, so nothing can fall off screen. Size now carries
   meaning beyond tier: more outstanding work puffs a bird up. Wire labels
   carry their own tallies. Facing is stable per project between loads. */
:root {
	--sky-top: #0d1016;
	--sky-low: #1a1d24;
	--horizon: #23262d;
	--ink: #e9e4d8;
	--muted: #9d978a;
	--faint: #67635a;
	--body-c: #272b31;
	--body-dim: #1f2227;
	--green: #66bb86;
	--amber: #d8a845;
	--red: #e25d4f;
	--accent: #b9b2a2;
	--display: "Bricolage Grotesque", system-ui, sans-serif;
	--body: "Figtree", system-ui, sans-serif;
	color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: linear-gradient(var(--sky-top), var(--sky-low) 75%, var(--horizon)); color: var(--ink); font-family: var(--body); overflow: hidden; }
header {
	position: fixed; top: 0; left: 0; right: 0; z-index: 2;
	display: flex; align-items: baseline; gap: 20px; flex-wrap: wrap;
	padding: 16px max(22px, env(safe-area-inset-right, 0px)) 0 max(22px, env(safe-area-inset-left, 0px));
	pointer-events: none;
}
header h1 { font: 700 22px var(--display); margin: 0; }
.totals { display: flex; gap: 16px; font-weight: 600; font-size: 13px; }
.totals .red { color: var(--red); } .totals .amber { color: var(--amber); } .totals .green { color: var(--green); }
header .scanned { margin-left: auto; color: var(--faint); font-size: 12px; }
svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.bird { cursor: pointer; }
.bird .label { font: 500 13px var(--body); fill: var(--muted); text-anchor: middle; letter-spacing: 0.02em; }
.bird:hover .label { fill: var(--ink); }
.bird .flock { transition: transform 0.2s; }
.bird:hover .flock { transform: translateY(-4px); }
.wirelabel { font: 700 11px var(--body); letter-spacing: 0.18em; text-transform: uppercase; fill: var(--faint); }
.wiretally { font: 500 11px var(--body); fill: var(--faint); }
.wiretally .red { fill: var(--red); } .wiretally .amber { fill: var(--amber); }
.tip {
	position: fixed; z-index: 3; pointer-events: none;
	background: #171a1f; border: 1px solid #333841; border-radius: 8px;
	padding: 9px 12px; font-size: 12.5px; color: var(--muted);
	max-width: 300px; display: none; box-shadow: 0 16px 40px -12px rgb(0 0 0 / 0.7);
}
.tip b { color: var(--ink); }
#sheetwrap { position: fixed; inset: 0; z-index: 4; background: rgb(8 9 12 / 0.6); display: none; align-items: center; justify-content: center; padding: 5vh max(16px, env(safe-area-inset-left, 0px)); }
#sheetwrap.show { display: flex; }
#sheet {
	background: #171a1f; border: 1px solid #333841; border-radius: 12px;
	width: min(620px, 100%); max-height: 86vh; overflow-y: auto;
	padding: 26px 28px; animation: rise 0.25s cubic-bezier(0.24, 0.9, 0.3, 1);
}
@keyframes rise { from { transform: translateY(26px); opacity: 0; } }
#sheet h2 { font: 700 28px var(--display); margin: 0 0 4px; }
#sheet .sub { color: var(--faint); font-size: 13px; margin-bottom: 10px; }
#sheet p { color: var(--muted); line-height: 1.55; margin: 8px 0; }
#sheet h3 { font: 700 11px var(--body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); margin: 18px 0 6px; }
#sheet table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
#sheet td { padding: 6px 0; border-top: 1px solid #262a31; }
#sheet td.v { text-align: right; color: var(--faint); white-space: nowrap; padding-left: 14px; font-variant-numeric: tabular-nums; }
.legend {
	position: fixed; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; z-index: 2;
	display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;
	font-size: 11px; color: var(--faint);
	padding-inline: max(16px, env(safe-area-inset-left, 0px));
}
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>
<header>
	<h1>The Aviary</h1>
	<div class="totals" id="totals"></div>
	<div class="scanned" id="scanned"></div>
</header>
<svg id="scene" aria-label="Projects as birds on wires"></svg>
<div class="tip" id="tip"></div>
<div id="sheetwrap"><div id="sheet"></div></div>
<div class="legend">
	<span><i style="background:var(--red)"></i>attention</span>
	<span><i style="background:var(--amber)"></i>drifting</span>
	<span><i style="background:var(--green)"></i>settled</span>
	<span>higher wire = more important · plumper bird = more outstanding work · ♪ = being edited · fence = not adopted</span>
</div>
<script src="./data.js"></script>
<script>
const { items, scannedAt } = window.PERCH_DATA;
const svgNS = "http://www.w3.org/2000/svg";
const ago = (d) => d === null ? "—" : d === 0 ? "today" : d === 1 ? "yesterday" : `${d}d ago`;
const adopted = items.filter((i) => i.adopted);
const triage = items.filter((i) => !i.adopted);
const rank = { red: 0, amber: 1, green: 2 };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

const tally = { red: 0, amber: 0, green: 0 };
for (const it of adopted) tally[it.health]++;
document.getElementById("totals").innerHTML =
	`<span class="red">${tally.red} attention</span><span class="amber">${tally.amber} drifting</span><span class="green">${tally.green} settled</span>`;
document.getElementById("scanned").textContent =
	`dusk scan, ${new Date(scannedAt).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}`;

function summary(it) {
	const g = it.git;
	if (!g) return `only on ${it.forges.map((f) => f.forge).join(" and ")}`;
	const bits = [];
	if (g.uncommitted) bits.push(`${g.uncommitted} uncommitted`);
	if (g.unpushed) bits.push(`${g.unpushed} unpushed`);
	if (g.driftDays) bits.push(`drifting ${g.driftDays}d`);
	if (it.work.bugs) bits.push(`${it.work.bugs} bugs`);
	if (g.backup === "no-remote") bits.push("one disk only");
	return bits.length ? bits.join(" · ") : `clean, touched ${ago(it.lastTouchedDays)}`;
}
/* Stable per-project facing and phase, so the flock does not reshuffle each load. */
function hash(s) { let h = 7; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }

const scene = document.getElementById("scene");
const tip = document.getElementById("tip");
const el = (name, attrs, parent) => {
	const n = document.createElementNS(svgNS, name);
	for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
	(parent ?? scene).appendChild(n);
	return n;
};

function draw() {
	scene.innerHTML = "";
	const W = 2000;
	const H = Math.max(850, Math.min(1500, Math.round(W * innerHeight / Math.max(innerWidth, 1))));
	scene.setAttribute("viewBox", `0 0 ${W} ${H}`);
	scene.setAttribute("preserveAspectRatio", "xMidYMid meet");
	const M = 110; /* side margin: nothing drawn outside it */

	/* Sky */
	el("circle", { cx: W - 300, cy: H * 0.13, r: 46, fill: "none", stroke: "#3a3e46", "stroke-width": 1.5 });
	el("circle", { cx: W - 316, cy: H * 0.13 - 8, r: 46, fill: "var(--sky-top)" });
	for (let i = 0; i < 40; i++) {
		const sh = hash(`star${i}`);
		el("circle", { cx: (sh % 1000) / 1000 * W, cy: ((sh >> 10) % 1000) / 1000 * H * 0.45, r: (sh % 10) / 10 + 0.4, fill: "#3c4049", opacity: 0.45 + ((sh >> 4) % 40) / 100 });
	}

	const sag = 22;
	function wire(y, label, list, thick) {
		el("path", { d: `M -20 ${y - 12} Q ${W / 2} ${y + sag} ${W + 20} ${y - 12}`, stroke: "#3a3e46", "stroke-width": thick, fill: "none" });
		if (label) {
			const t = el("text", { x: 36, y: y - 26, class: "wirelabel" });
			t.textContent = label;
			const red = list.filter((i) => i.health === "red").length;
			const amber = list.filter((i) => i.health === "amber").length;
			const tt = el("text", { x: 36 + label.length * 9 + 18, y: y - 26, class: "wiretally" });
			tt.innerHTML = red || amber
				? `${red ? `<tspan class="red">${red} attention</tspan>` : ""}${red && amber ? " · " : ""}${amber ? `<tspan class="amber">${amber} drifting</tspan>` : ""}`
				: "all settled";
		}
	}
	const wireY = (y, x) => {
		const t = (x + 20) / (W + 40);
		return (1 - t) * (1 - t) * (y - 12) + 2 * (1 - t) * t * (y + sag) + t * t * (y - 12);
	};
	function fence(y) {
		el("line", { x1: 0, y1: y, x2: W, y2: y, stroke: "#30343b", "stroke-width": 7 });
		el("line", { x1: 0, y1: y + 30, x2: W, y2: y + 30, stroke: "#2a2d34", "stroke-width": 6 });
		for (let x = 60; x < W; x += 160) {
			el("line", { x1: x, y1: y - 8, x2: x, y2: Math.min(y + 80, H), stroke: "#2a2d34", "stroke-width": 11 });
		}
		const t = el("text", { x: 36, y: y - 24, class: "wirelabel" });
		t.textContent = `On the fence · ${triage.length} not adopted`;
	}
	/* Spread n points between margins, capped spacing, centred. */
	function spread(n, cap) {
		if (n === 1) return [W / 2];
		const span = Math.min((n - 1) * cap, W - 2 * M);
		const start = (W - span) / 2;
		return Array.from({ length: n }, (_, i) => start + (span / (n - 1)) * i);
	}

	function bird(it, x, y, base, dim) {
		x = Math.max(M, Math.min(W - M, x));
		/* Plumpness: outstanding work inflates the body, capped. */
		const plump = 1 + Math.min(it.work.total, 30) / 30 * 0.3;
		const scale = base * plump;
		const face = hash(it.id) % 2 ? 1 : -1;
		const g = el("g", { class: "bird", transform: `translate(${x} ${y})`, tabindex: 0 });
		const flock = el("g", { class: "flock" }, g);
		const inner = el("g", { transform: `scale(${scale * face} ${scale})` }, flock);
		const bodyFill = dim ? "var(--body-dim)" : "var(--body-c)";
		const breast = dim ? "#3a3e45" : `var(--${it.health})`;
		el("line", { x1: -6, y1: -8, x2: -7, y2: 2, stroke: "#4a4e55", "stroke-width": 2.4 }, inner);
		el("line", { x1: 6, y1: -8, x2: 7, y2: 2, stroke: "#4a4e55", "stroke-width": 2.4 }, inner);
		el("path", { d: "M -16 -22 L -42 -10 L -38 -20 L -44 -26 L -20 -32 Z", fill: bodyFill }, inner);
		el("ellipse", { cx: 0, cy: -26, rx: 23, ry: 19, fill: bodyFill }, inner);
		el("path", { d: "M 10 -14 A 18 16 0 0 0 20 -34 A 23 19 0 0 1 2 -8 Z", fill: breast }, inner);
		el("circle", { cx: 14, cy: -30, r: 5.5, fill: breast, opacity: 0.9 }, inner);
		el("circle", { cx: 16, cy: -44, r: 11.5, fill: bodyFill }, inner);
		el("path", { d: "M 26 -45 L 37 -42 L 26 -39 Z", fill: "var(--accent)" }, inner);
		el("circle", { cx: 19.5, cy: -46, r: 1.8, fill: "#0d0f12" }, inner);
		el("path", { d: "M -14 -28 Q 2 -36 8 -24 Q -2 -16 -14 -28 Z", fill: "#00000022" }, inner);
		const label = el("text", { y: 26, class: "label" }, g);
		label.textContent = it.displayName;
		if (!dim && it.git?.activity === "editing") {
			const note = el("text", { x: 26 * face * scale, y: -62 * scale, fill: "var(--accent)", "font-size": 15, "text-anchor": "middle" }, g);
			note.textContent = "♪";
			if (!reduce) note.animate?.([{ opacity: 0.2 }, { opacity: 1 }, { opacity: 0.2 }], { duration: 2600, iterations: Infinity });
		}
		if (!reduce && g.animate) {
			g.animate(
				[{ transform: `translate(${x}px, ${y - 130}px)`, opacity: 0 }, { transform: `translate(${x}px, ${y}px)`, opacity: 1 }],
				{ duration: 480, delay: (hash(it.id) % 600), easing: "cubic-bezier(0.3, 1.4, 0.5, 1)", fill: "backwards" },
			);
			flock.animate(
				[{ transform: "translateY(0)" }, { transform: "translateY(-2.5px)" }, { transform: "translateY(0)" }],
				{ duration: 3200 + (hash(it.id) % 1800), delay: hash(it.id) % 2000, iterations: Infinity, easing: "ease-in-out" },
			);
		}
		g.addEventListener("mousemove", (e) => {
			tip.style.display = "block";
			tip.innerHTML = `<b>${it.displayName}</b> · ${dim ? "not adopted" : it.health}<br>${summary(it)}`;
			tip.style.left = `${Math.min(e.clientX + 16, innerWidth - 310)}px`;
			tip.style.top = `${Math.min(e.clientY + 18, innerHeight - 90)}px`;
		});
		g.addEventListener("mouseleave", () => { tip.style.display = "none"; });
		g.addEventListener("click", () => openSheet(it, dim));
		g.addEventListener("keydown", (e) => { if (e.key === "Enter") openSheet(it, dim); });
	}

	const t1 = adopted.filter((i) => i.tier === "machine-home").sort((a, b) => rank[a.health] - rank[b.health]);
	const t2 = adopted.filter((i) => i.tier === "projects").sort((a, b) => rank[a.health] - rank[b.health]);
	const rowA = t2.filter((_, i) => i % 2 === 0), rowB = t2.filter((_, i) => i % 2 === 1);
	const y1 = H * 0.27, y2 = H * 0.52, y3 = H * 0.67, yF = H * 0.86;
	wire(y1, "Machine & Home", t1, 4);
	wire(y2, "Projects", t2, 3);
	wire(y3, "", [], 3);
	fence(yF);
	spread(t1.length, 350).forEach((x, i) => bird(t1[i], x, wireY(y1, x), 1.4, false));
	spread(rowA.length, 330).forEach((x, i) => bird(rowA[i], x, wireY(y2, x), 0.95, false));
	spread(rowB.length, 330).forEach((x, i) => bird(rowB[i], x + 150, wireY(y3, x + 150), 0.95, false));
	spread(triage.length, 220).forEach((x, i) => bird(triage[i], x, yF + 2, 0.68, true));
}
draw();
let rT;
addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(draw, 150); });

const wrap = document.getElementById("sheetwrap");
const sheet = document.getElementById("sheet");
function openSheet(it, dim) {
	const row = (k, v) => `<tr><td>${k}</td><td class="v">${v}</td></tr>`;
	let h = `<h2>${it.displayName}</h2><div class="sub">${it.id} · ${dim ? "not adopted" : it.health} · ${it.forges.map((f) => f.fullName).join(" + ") || "no forge"} · session ${ago(it.lastSessionDays)}</div>
		<p>${summary(it)}.</p>`;
	if (it.git?.branches?.length) h += `<h3>Branches</h3><table>${it.git.branches.map((b) => row(`<b>${b.name}</b> ${b.subject ?? ""}`, ago(b.daysAgo))).join("")}</table>`;
	if (it.groups.length) h += `<h3>Roadmap</h3><table>${it.groups.map((g) => row(g.heading, g.done ? `${g.done}/${g.items}` : g.items)).join("")}</table>`;
	if (it.finalised.length) h += `<h3>Finalised</h3><table>${it.finalised.map((c) => row(c.subject, c.at ? c.at.slice(0, 10) : "")).join("")}</table>`;
	sheet.innerHTML = h;
	wrap.classList.add("show");
}
wrap.addEventListener("click", (e) => { if (e.target === wrap) wrap.classList.remove("show"); });
window.addEventListener("keydown", (e) => { if (e.key === "Escape") wrap.classList.remove("show"); });
</script>
</body>
</html>
