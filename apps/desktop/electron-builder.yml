appId: com.github.the-undev.perch
productName: Perch
directories:
  output: dist
files:
  - out/**
  - package.json
extraResources:
  # The window's and the tray's icons, found where the dev build finds them in resources/.
  - from: resources
    to: .
    filter:
      - icons/*.png
      - tray*.png
linux:
  target: AppImage
  category: Development
  executableName: perch
  syncDesktopName: true
  icon: resources/icons
artifactName: ${productName}-${version}-${arch}.${ext}
# The update feed electron-updater reads: latest-linux.yml beside the AppImage on each GitHub
# release. The build never publishes; CI uploads the files.
publish:
  provider: github
  owner: the-undev
  repo: perch
