<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perch Data Atlas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* The data placement audit, as a page. Every field the scanner gathers,
   with real example values from the live scan, a category, and a
   destination: bird, bubble, detail or hidden. Click to assign; choices
   persist in this browser; export prints the result as markdown for the
   decision doc. Data comes from atlas-data.js (gitignored), regenerate
   with: node scripts/atlas-data.mjs */
:root {
	--display: "Bricolage Grotesque", system-ui, sans-serif;
	--body: "Figtree", system-ui, sans-serif;
	--mono: "JetBrains Mono", ui-monospace, monospace;
	color-scheme: dark;
	--bg: #101214; --rail: #121517; --band: #15181b; --card: #1a1e22; --card-hi: #20252a;
	--edge: #2b3036; --edge-hi: #3e454d; --ink: #ece7db; --muted: #a09a8c; --faint: #6e6960;
	--accent: #b9b2a2; --green: #66bb86; --amber: #d8a845; --red: #e25d4f;
	--c-identity: #b9b2a2; --c-activity: #86a7c8; --c-health: #66bb86;
	--c-work: #c9a86a; --c-risk: #e25d4f; --c-meta: #6e6960;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; display: flex; overflow: hidden; }

nav { width: 250px; flex: none; background: var(--rail); border-right: 1px solid var(--edge); display: flex; flex-direction: column; min-height: 0; }
nav .brand { padding: 16px 16px 10px max(16px, env(safe-area-inset-left, 0px)); }
nav h1 { font: 700 19px var(--display); margin: 0; }
nav .sub { color: var(--faint); font-size: 11.5px; margin-top: 3px; }
nav .scroll { overflow-y: auto; flex: 1; padding: 6px 10px 12px; }
nav .src { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 7px; cursor: pointer; }
nav .src:hover { background: var(--card); }
nav .src .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
nav .src .ct { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
nav .src .ct b { color: var(--green); font-weight: 600; }
nav .foot { flex: none; border-top: 1px solid var(--edge); padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); font-size: 11px; color: var(--faint); line-height: 1.6; }

main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.bar {
	flex: none; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
	padding: 12px max(22px, env(safe-area-inset-right, 0px)) 12px 22px;
	background: var(--band); border-bottom: 1px solid var(--edge);
}
.bar .progress { font-weight: 600; font-size: 13px; }
.bar .progress b { color: var(--green); }
.bar input, .bar select {
	background: var(--card); border: 1px solid var(--edge); color: var(--ink);
	font: 500 12.5px var(--body); border-radius: 8px; padding: 7px 10px;
}
.bar input { width: 220px; }
.bar input:focus, .bar select:focus { outline: none; border-color: var(--edge-hi); }
.bar .export {
	margin-left: auto; cursor: pointer;
	background: var(--card-hi); border: 1px solid var(--edge-hi); color: var(--ink);
	font: 600 12.5px var(--body); border-radius: 8px; padding: 8px 14px;
}
.bar .export:hover { background: #262b31; }

.content { flex: 1; overflow-y: auto; padding: 18px max(22px, env(safe-area-inset-right, 0px)) 40px 22px; }
section { margin-bottom: 30px; }
section > h2 { font: 700 20px var(--display); margin: 0 0 2px; }
section .file { color: var(--faint); font-size: 12px; margin-bottom: 12px; font-family: var(--mono); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 10px; }
.fcard {
	background: var(--card); border: 1px solid var(--edge); border-left: 3px solid var(--edge);
	border-radius: 9px; padding: 11px 13px 10px; display: flex; flex-direction: column; gap: 7px;
}
.fcard.undecided { border-left-color: var(--amber); }
.fcard.hidden-dest { opacity: 0.62; }
.fcard .top { display: flex; align-items: baseline; gap: 10px; }
.fcard .path { font: 600 12.5px var(--mono); word-break: break-all; flex: 1; }
.fcard .pres { font-size: 11px; color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
.fcard .types { font-size: 10.5px; color: var(--faint); letter-spacing: 0.05em; }
.fcard .ex { font: 400 11px var(--mono); color: var(--muted); line-height: 1.55; word-break: break-all; }
.fcard .ex div::before { content: "· "; color: var(--faint); }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tags button {
	background: var(--band); border: 1px solid var(--edge); color: var(--faint);
	font: 600 10px var(--body); letter-spacing: 0.06em; text-transform: uppercase;
	border-radius: 999px; padding: 3px 9px; cursor: pointer;
}
.tags button:hover { color: var(--muted); border-color: var(--edge-hi); }
.tags.cats button.on { color: #14171b; border-color: transparent; }
.tags.cats button.on.identity { background: var(--c-identity); }
.tags.cats button.on.activity { background: var(--c-activity); }
.tags.cats button.on.health { background: var(--c-health); }
.tags.cats button.on.work { background: var(--c-work); }
.tags.cats button.on.risk { background: var(--c-risk); }
.tags.cats button.on.meta { background: var(--c-meta); color: var(--ink); }
.tags.dests button.on { background: var(--ink); color: #14171b; border-color: transparent; }
.tags.dests button.on.undecided { background: var(--amber); }
details.containers { margin-top: 10px; }
details.containers summary { cursor: pointer; color: var(--faint); font-size: 12px; }
details.containers div { font: 400 11.5px var(--mono); color: var(--faint); padding: 2px 0 0 16px; }

#overlay {
	position: fixed; inset: 0; z-index: 10; display: none;
	background: rgb(0 0 0 / 0.55); align-items: center; justify-content: center; padding: 30px;
}
#overlay.show { display: flex; }
#overlay .box {
	background: var(--band); border: 1px solid var(--edge-hi); border-radius: 12px;
	width: min(900px, 100%); max-height: 100%; display: flex; flex-direction: column; padding: 18px;
}
#overlay h3 { font: 700 18px var(--display); margin: 0 0 10px; }
#overlay textarea {
	flex: 1; min-height: 340px; background: var(--card); color: var(--muted);
	border: 1px solid var(--edge); border-radius: 8px; padding: 12px;
	font: 400 11.5px var(--mono); resize: vertical; white-space: pre;
}
#overlay .row { display: flex; gap: 10px; margin-top: 12px; }
#overlay .row button {
	background: var(--card-hi); border: 1px solid var(--edge-hi); color: var(--ink);
	font: 600 12.5px var(--body); border-radius: 8px; padding: 8px 14px; cursor: pointer;
}
</style>
</head>
<body>
<nav>
	<div class="brand"><h1>Data Atlas</h1><div class="sub" id="gen"></div></div>
	<div class="scroll" id="srcnav"></div>
	<div class="foot">Click a category and a destination on every field. Amber edge = undecided. Choices stay in this browser; export when done and the result goes into a decision doc.</div>
</nav>
<main>
	<div class="bar">
		<span class="progress" id="progress"></span>
		<input id="search" type="search" placeholder="filter paths…">
		<select id="fcat"><option value="">every category</option></select>
		<select id="fdest"><option value="">every destination</option></select>
		<button class="export" id="export">Export</button>
	</div>
	<div class="content" id="content"></div>
</main>
<div id="overlay"><div class="box">
	<h3>Assignments</h3>
	<textarea id="out" readonly></textarea>
	<div class="row"><button id="copy">Copy</button><button id="close">Close</button></div>
</div></div>
<script src="./atlas-data.js"></script>
<script>
const { sources, generatedAt } = window.ATLAS;
const CATS = ["identity", "activity", "health", "work", "risk", "meta"];
const DESTS = ["bird", "bubble", "detail", "hidden", "undecided"];
document.getElementById("gen").textContent = `from the scan · generated ${new Date(generatedAt).toLocaleString("en-GB")}`;

/* Proposed starting assignments. Raw facts mostly land in detail or
   hidden (joins, machinery); the derived snapshot carries the bird and
   bubble candidates. Everything else starts undecided. */
const SEEDS = {
	"git:items{}.state": ["meta", "hidden"],
	"git:items{}.value.head": ["identity", "detail"],
	"git:items{}.value.originHead": ["meta", "detail"],
	"git:items{}.value.remotes": ["meta", "hidden"],
	"git:items{}.value.dirtyFiles": ["activity", "detail"],
	"git:items{}.value.unpushedCommits": ["risk", "detail"],
	"git:items{}.value.branches[]": ["work", "detail"],
	"git:items{}.value.lastCommit": ["activity", "bubble"],
	"claudeSessions:data{}.value.newest": ["activity", "bubble"],
	"claudeSessions:data{}.value.transcripts": ["meta", "detail"],
	"claudeSessions:data{}.value.directory": ["identity", "hidden"],
	"roadmap:data{}.state": ["meta", "hidden"],
	"roadmap:data{}.value.files[].path": ["identity", "detail"],
	"roadmap:data{}.value.files[].structure.value.sections[].heading": ["work", "detail"],
	"roadmap:data{}.value.files[].structure.value.sections[].bullets[].checkbox": ["work", "detail"],
	"roadmap:data{}.value.files[].structure.value.sections[].bullets[].tags": ["work", "detail"],
	"discovery:home": ["meta", "hidden"],
	"discovery:warnings": ["meta", "detail"],
	"github:data{}.state": ["meta", "hidden"],
	"github:data{}.value.account": ["identity", "hidden"],
	"github:data{}.value.aliases": ["identity", "hidden"],
	"github:data{}.value.foundBy": ["meta", "hidden"],
	"forgejo:data{}.state": ["meta", "hidden"],
	"forgejo:data{}.value.account": ["identity", "hidden"],
	"forgejo:data{}.value.aliases": ["identity", "hidden"],
	"forgejo:data{}.value.foundBy": ["meta", "hidden"],
	"status:durationMs": ["meta", "hidden"],
	"status:sources": ["meta", "hidden"],
	"snapshot (derived):items[].id": ["identity", "detail"],
	"snapshot (derived):items[].name": ["identity", "bird"],
	"snapshot (derived):items[].kind": ["identity", "bird"],
	"snapshot (derived):items[].importance": ["identity", "bird"],
	"snapshot (derived):items[].path": ["identity", "detail"],
	"snapshot (derived):items[].flags[]": ["health", "bubble"],
	"snapshot (derived):items[].liveSources": ["meta", "detail"],
	"snapshot (derived):items[].presences.local.path": ["identity", "detail"],
	"snapshot (derived):conflicts": ["risk", "detail"],
	"snapshot (derived):warnings": ["meta", "detail"],
	"snapshot (derived):configPath": ["meta", "hidden"],
	"snapshot (derived):durationMs": ["meta", "hidden"],
	"snapshot (derived):aggregatedAt": ["meta", "hidden"],
};
function seedFor(src, path) {
	if (path === "gatheredAt" || path === "source") return ["meta", "hidden"];
	return SEEDS[`${src}:${path}`] ?? ["", "undecided"];
}

let store = {};
try { store = JSON.parse(localStorage.getItem("perch-atlas-v1") ?? "{}"); } catch {}
const save = () => { try { localStorage.setItem("perch-atlas-v1", JSON.stringify(store)); } catch {} };
const keyOf = (src, path) => `${src}:${path}`;
function assignment(src, path) {
	const seed = seedFor(src, path);
	const o = store[keyOf(src, path)] ?? {};
	return { cat: o.cat ?? seed[0], dest: o.dest ?? seed[1] };
}

/* A leaf holds scalar values; containers are structure, listed but not
   assigned. */
const isLeaf = (f) => f.types.some((t) => t !== "object" && t !== "array");
const leaves = [];
for (const s of sources) for (const f of s.fields) if (isLeaf(f)) leaves.push([s.name, f]);

const esc = (t) => t.replaceAll("&", "&amp;").replaceAll("<", "&lt;");
const content = document.getElementById("content");
const srcnav = document.getElementById("srcnav");

function render() {
	content.innerHTML = "";
	srcnav.innerHTML = "";
	for (const s of sources) {
		const sec = document.createElement("section");
		sec.id = `src-${s.name.replaceAll(/\W/g, "-")}`;
		const leafFields = s.fields.filter(isLeaf);
		const containers = s.fields.filter((f) => !isLeaf(f));
		sec.innerHTML = `<h2>${esc(s.name)}</h2><div class="file">${esc(s.file)}</div>`;
		const grid = document.createElement("div");
		grid.className = "grid";
		for (const f of leafFields) grid.appendChild(card(s.name, f));
		sec.appendChild(grid);
		if (containers.length) {
			const d = document.createElement("details");
			d.className = "containers";
			d.innerHTML = `<summary>${containers.length} structural paths</summary>` +
				containers.map((f) => `<div>${esc(f.path)} · ${f.types.join("/")} · ${f.count}×</div>`).join("");
			sec.appendChild(d);
		}
		content.appendChild(sec);
		const row = document.createElement("div");
		row.className = "src";
		row.innerHTML = `<span class="nm">${esc(s.name)}</span><span class="ct" data-src="${esc(s.name)}"></span>`;
		row.addEventListener("click", () => sec.scrollIntoView({ behavior: "smooth" }));
		srcnav.appendChild(row);
	}
	refresh();
}

function card(src, f) {
	const c = document.createElement("article");
	c.className = "fcard";
	c.dataset.src = src;
	c.dataset.path = f.path;
	c.innerHTML = `
		<div class="top"><span class="path">${esc(f.path)}</span><span class="pres">${f.count}/${f.parentCount}</span></div>
		<div class="types">${f.types.join(" · ")}</div>
		<div class="ex">${f.examples.map((e) => `<div>${esc(e)}</div>`).join("")}</div>
		<div class="tags cats">${CATS.map((x) => `<button class="${x}" data-cat="${x}">${x}</button>`).join("")}</div>
		<div class="tags dests">${DESTS.map((x) => `<button class="${x}" data-dest="${x}">${x}</button>`).join("")}</div>`;
	c.addEventListener("click", (e) => {
		const b = e.target.closest("button");
		if (!b) return;
		const k = keyOf(src, f.path);
		store[k] = store[k] ?? {};
		if (b.dataset.cat) store[k].cat = b.dataset.cat;
		if (b.dataset.dest) store[k].dest = b.dataset.dest;
		save();
		refresh();
	});
	return c;
}

const fcat = document.getElementById("fcat");
const fdest = document.getElementById("fdest");
for (const x of CATS) fcat.insertAdjacentHTML("beforeend", `<option>${x}</option>`);
for (const x of DESTS) fdest.insertAdjacentHTML("beforeend", `<option>${x}</option>`);
const search = document.getElementById("search");
for (const elx of [fcat, fdest]) elx.addEventListener("change", refresh);
search.addEventListener("input", refresh);

function refresh() {
	const q = search.value.toLowerCase();
	const wantCat = fcat.value, wantDest = fdest.value;
	const perSrc = {};
	let assigned = 0;
	for (const c of content.querySelectorAll(".fcard")) {
		const { src, path } = c.dataset;
		const a = assignment(src, path);
		if (a.dest !== "undecided") assigned++;
		perSrc[src] = perSrc[src] ?? { total: 0, done: 0 };
		perSrc[src].total++;
		if (a.dest !== "undecided") perSrc[src].done++;
		c.classList.toggle("undecided", a.dest === "undecided");
		c.classList.toggle("hidden-dest", a.dest === "hidden");
		for (const b of c.querySelectorAll("[data-cat]")) b.classList.toggle("on", b.dataset.cat === a.cat);
		for (const b of c.querySelectorAll("[data-dest]")) b.classList.toggle("on", b.dataset.dest === a.dest);
		const visible = (!q || path.toLowerCase().includes(q))
			&& (!wantCat || a.cat === wantCat)
			&& (!wantDest || a.dest === wantDest);
		c.style.display = visible ? "" : "none";
	}
	for (const sec of content.querySelectorAll("section")) {
		const any = [...sec.querySelectorAll(".fcard")].some((c) => c.style.display !== "none");
		sec.style.display = any ? "" : "none";
	}
	for (const ct of srcnav.querySelectorAll(".ct")) {
		const p = perSrc[ct.dataset.src] ?? { total: 0, done: 0 };
		ct.innerHTML = `<b>${p.done}</b>/${p.total}`;
	}
	document.getElementById("progress").innerHTML = `<b>${assigned}</b> of ${leaves.length} assigned`;
}

document.getElementById("export").addEventListener("click", () => {
	const lines = ["# Data placement", "", `Exported ${new Date().toISOString().slice(0, 16)} from the atlas.`];
	for (const s of sources) {
		const leafFields = s.fields.filter(isLeaf);
		if (!leafFields.length) continue;
		lines.push("", `## ${s.name}`, "", "| field | types | presence | category | destination |", "| --- | --- | --- | --- | --- |");
		for (const f of leafFields) {
			const a = assignment(s.name, f.path);
			lines.push(`| \`${f.path}\` | ${f.types.join(", ")} | ${f.count}/${f.parentCount} | ${a.cat || "TBD"} | ${a.dest === "undecided" ? "TBD" : a.dest} |`);
		}
	}
	document.getElementById("out").value = lines.join("\n");
	document.getElementById("overlay").classList.add("show");
});
document.getElementById("close").addEventListener("click", () => document.getElementById("overlay").classList.remove("show"));
document.getElementById("copy").addEventListener("click", async () => {
	const out = document.getElementById("out");
	try { await navigator.clipboard.writeText(out.value); } catch { out.select(); }
});
window.addEventListener("keydown", (e) => { if (e.key === "Escape") document.getElementById("overlay").classList.remove("show"); });

render();
</script>
</body>
</html>
