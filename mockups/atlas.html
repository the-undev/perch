<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perch Data Atlas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* The data placement audit, as a page. Every field the scanner gathers,
   as an indented tree in path order: declared type from src/raw.ts and
   src/snapshot.ts beside real values from the live scan. Click a
   category and destination on any node; an assignment cascades to the
   subtree beneath it unless a child is set explicitly. Choices persist
   in this browser; export prints markdown for the decision doc. Data
   comes from atlas-data.js (gitignored): node scripts/atlas-data.mjs */
:root {
	--display: "Bricolage Grotesque", system-ui, sans-serif;
	--body: "Figtree", system-ui, sans-serif;
	--mono: ui-monospace, "JetBrains Mono", monospace;
	color-scheme: dark;
	--bg: #101214; --rail: #121517; --band: #15181b; --card: #1a1e22; --card-hi: #20252a;
	--edge: #2b3036; --edge-hi: #3e454d; --ink: #ece7db; --muted: #a09a8c; --faint: #6e6960;
	--accent: #b9b2a2; --green: #66bb86; --amber: #d8a845; --red: #e25d4f;
	--c-identity: #b9b2a2; --c-activity: #86a7c8; --c-health: #66bb86;
	--c-work: #c9a86a; --c-risk: #e25d4f; --c-meta: #6e6960;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; display: flex; overflow: hidden; }

nav { width: 250px; flex: none; background: var(--rail); border-right: 1px solid var(--edge); display: flex; flex-direction: column; min-height: 0; }
nav .brand { padding: 16px 16px 10px max(16px, env(safe-area-inset-left, 0px)); }
nav h1 { font: 700 19px var(--display); margin: 0; }
nav .sub { color: var(--faint); font-size: 11.5px; margin-top: 3px; }
nav .scroll { overflow-y: auto; flex: 1; padding: 6px 10px 12px; }
nav .src { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 7px; cursor: pointer; }
nav .src:hover { background: var(--card); }
nav .src .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
nav .src .ct { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
nav .src .ct b { color: var(--green); font-weight: 600; }
nav .foot { flex: none; border-top: 1px solid var(--edge); padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); font-size: 11px; color: var(--faint); line-height: 1.6; }

main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.bar {
	flex: none; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
	padding: 12px max(22px, env(safe-area-inset-right, 0px)) 12px 22px;
	background: var(--band); border-bottom: 1px solid var(--edge);
}
.bar .progress { font-weight: 600; font-size: 13px; }
.bar .progress b { color: var(--green); }
.bar input, .bar select {
	background: var(--card); border: 1px solid var(--edge); color: var(--ink);
	font: 500 12.5px var(--body); border-radius: 8px; padding: 7px 10px;
}
.bar input { width: 220px; }
.bar input:focus, .bar select:focus { outline: none; border-color: var(--edge-hi); }
.bar .export {
	margin-left: auto; cursor: pointer;
	background: var(--card-hi); border: 1px solid var(--edge-hi); color: var(--ink);
	font: 600 12.5px var(--body); border-radius: 8px; padding: 8px 14px;
}
.bar .export:hover { background: #262b31; }

.content { flex: 1; overflow-y: auto; padding: 18px max(22px, env(safe-area-inset-right, 0px)) 40px 22px; }
section { margin-bottom: 34px; }
section > h2 { font: 700 20px var(--display); margin: 0 0 2px; }
section .file { color: var(--faint); font-size: 12px; margin-bottom: 10px; font-family: var(--mono); }
.flist { border: 1px solid var(--edge); border-radius: 10px; background: var(--card); overflow: hidden; }
.frow {
	display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
	padding: 5px 12px; border-left: 3px solid transparent; border-top: 1px solid var(--band);
}
.frow:first-child { border-top: 0; }
.frow.undecided { border-left-color: var(--amber); }
.frow.hidden-dest { opacity: 0.55; }
.frow.container { background: var(--band); }
.frow .path { font: 600 12px var(--mono); flex: 0 1 420px; min-width: 200px; cursor: default; }
.frow .path .dim { color: var(--faint); font-weight: 400; }
.frow .decl { font: 400 11px var(--mono); color: #86a7c8; flex: 1 1 240px; min-width: 180px; }
.frow .ex { font: 400 11px var(--mono); color: var(--muted); flex: 1 1 220px; min-width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.frow .pres { font-size: 11px; color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; flex: none; width: 54px; text-align: right; }
.tags { display: flex; gap: 4px; flex: none; }
.tags button {
	background: var(--bg); border: 1px solid var(--edge); color: var(--faint);
	font: 600 9.5px var(--body); letter-spacing: 0.05em; text-transform: uppercase;
	border-radius: 999px; padding: 3px 8px; cursor: pointer;
}
.tags button:hover { color: var(--muted); border-color: var(--edge-hi); }
.tags.cats button.on { color: #14171b; border-color: transparent; }
.tags.cats button.on.identity { background: var(--c-identity); }
.tags.cats button.on.activity { background: var(--c-activity); }
.tags.cats button.on.health { background: var(--c-health); }
.tags.cats button.on.work { background: var(--c-work); }
.tags.cats button.on.risk { background: var(--c-risk); }
.tags.cats button.on.meta { background: var(--c-meta); color: var(--ink); }
.tags.dests button.on { background: var(--ink); color: #14171b; border-color: transparent; }
.tags.dests button.on.undecided { background: var(--amber); }
.frow .via { flex: none; width: 58px; font-size: 9.5px; color: var(--faint); text-align: right; letter-spacing: 0.05em; }

#overlay {
	position: fixed; inset: 0; z-index: 10; display: none;
	background: rgb(0 0 0 / 0.55); align-items: center; justify-content: center; padding: 30px;
}
#overlay.show { display: flex; }
#overlay .box {
	background: var(--band); border: 1px solid var(--edge-hi); border-radius: 12px;
	width: min(1000px, 100%); max-height: 100%; display: flex; flex-direction: column; padding: 18px;
}
#overlay h3 { font: 700 18px var(--display); margin: 0 0 10px; }
#overlay textarea {
	flex: 1; min-height: 340px; background: var(--card); color: var(--muted);
	border: 1px solid var(--edge); border-radius: 8px; padding: 12px;
	font: 400 11.5px var(--mono); resize: vertical; white-space: pre;
}
#overlay .row { display: flex; gap: 10px; margin-top: 12px; }
#overlay .row button {
	background: var(--card-hi); border: 1px solid var(--edge-hi); color: var(--ink);
	font: 600 12.5px var(--body); border-radius: 8px; padding: 8px 14px; cursor: pointer;
}
</style>
</head>
<body>
<nav>
	<div class="brand"><h1>Data Atlas</h1><div class="sub" id="gen"></div></div>
	<div class="scroll" id="srcnav"></div>
	<div class="foot">Every node has a proposed category and destination; click to override. Setting a parent cascades down its subtree. Amber edge = undecided. The last column says where an assignment came from. Export when done; the result becomes a decision doc.</div>
</nav>
<main>
	<div class="bar">
		<span class="progress" id="progress"></span>
		<input id="search" type="search" placeholder="filter paths…">
		<select id="fcat"><option value="">every category</option></select>
		<select id="fdest"><option value="">every destination</option></select>
		<button class="export" id="export">Export</button>
	</div>
	<div class="content" id="content"></div>
</main>
<div id="overlay"><div class="box">
	<h3>Assignments</h3>
	<textarea id="out" readonly></textarea>
	<div class="row"><button id="copy">Copy</button><button id="close">Close</button></div>
</div></div>
<script src="./atlas-data.js"></script>
<script>
const { sources, generatedAt } = window.ATLAS;
const CATS = ["identity", "activity", "health", "work", "risk", "meta"];
const DESTS = ["bird", "bubble", "detail", "hidden", "undecided"];
document.getElementById("gen").textContent = `from the scan · generated ${new Date(generatedAt).toLocaleString("en-GB")}`;

const CAT_DEFS = {
	identity: "What the thing is: names, ids, paths, urls, flags of nature (archived, fork)",
	activity: "What is happening or happened recently: edits, commits, sessions, timestamps",
	health: "Judged state: CI results, drift levels, flags, up/down",
	work: "Outstanding or finished work: roadmap items, bugs, PRs, unpushed commits, dirty files",
	risk: "Exposure to loss or surprise: backup status, one disk only, config conflicts",
	meta: "The scan's own machinery: absence states, reasons, timings, errors",
};
const DEST_DEFS = {
	bird: "Worn by the bird itself: colour, size, position, motion",
	bubble: "In the speech bubble: the first-person line and the fact chips",
	detail: "Only on the full project page",
	hidden: "Never displayed: joins, derivation inputs, machinery",
	undecided: "Not yet placed",
};

/* Hand-set assignments where the rules below would guess wrong. */
const SEEDS = {
	"claudeSessions:data{}.value.newest": ["activity", "bubble"],
	"claudeSessions:data{}.value.transcripts": ["meta", "detail"],
	"claudeSessions:data{}.value.directory": ["identity", "hidden"],
	"github:data{}.value.account": ["identity", "hidden"],
	"github:data{}.value.aliases": ["identity", "hidden"],
	"forgejo:data{}.value.account": ["identity", "hidden"],
	"forgejo:data{}.value.aliases": ["identity", "hidden"],
	"snapshot (derived):items[].name": ["identity", "bird"],
	"snapshot (derived):items[].kind": ["identity", "bird"],
	"snapshot (derived):items[].importance": ["identity", "bird"],
	"snapshot (derived):configPath": ["meta", "hidden"],
};

/* Rule proposals on the field name. Raw sources never propose bird or
   bubble; those read from the derived snapshot. */
function ruleFor(src, path) {
	const seg = path.split(".").pop().replace(/(\[\]|\{\})+$/, "");
	const snap = src.startsWith("snapshot");
	const has = (s) => path.includes(s);
	if (snap && has("flags[]")) return ["health", "bubble"];
	if (["state", "reason", "error", "gatheredAt", "source", "durationMs", "lastSucceededAt",
		"foundBy", "aliases", "account", "basis", "skippedForks", "configPath", "aggregatedAt",
		"scannedAt", "amberDays", "redDays", "line", "level"].includes(seg)) return ["meta", "hidden"];
	if (snap && seg === "activity") return ["activity", "bird"];
	if (snap && seg === "driftDays") return ["health", "bird"];
	if (snap && has("drift")) return ["health", "detail"];
	if (snap && seg === "backup") return ["risk", "bubble"];
	if (snap && ["uncommittedCount", "unpushedCount"].includes(seg)) return ["work", "bubble"];
	if (snap && has("counts")) return ["work", "bubble"];
	if (snap && has("latestCi")) return ["health", "bubble"];
	if (snap && seg === "allUp") return ["health", "bubble"];
	if (["warnings", "conflicts"].includes(seg)) return ["risk", "detail"];
	if (["conclusion", "status", "combinedStatus", "heartbeats"].includes(seg) || has(".ci")) return ["health", "detail"];
	if (["ahead", "behind"].includes(seg)) return ["work", "detail"];
	if (["archived", "fork", "private", "ignored", "draft"].includes(seg)) return ["identity", "detail"];
	if (/[uU]rl/.test(seg)) return ["identity", "detail"];
	if (["name", "fullName", "owner", "id", "itemId", "ref", "path", "directory", "file",
		"include", "defaultBranch", "branch", "upstream", "head", "sha", "kind", "importance",
		"folder", "livesyncPlugin", "number", "author", "context", "group", "monitors",
		"statusPage", "liveSources", "obsidian", "includes", "presences", "forges", "info"].includes(seg)) return ["identity", "detail"];
	if (/At$/.test(seg) || ["mtime", "time", "newest"].includes(seg)) return ["activity", "detail"];
	if (["subject", "title", "text", "heading", "prose", "body", "message", "checkbox", "tags",
		"done", "progress", "total", "items", "bullets", "groups", "role", "openPullRequests",
		"unpushedCommits", "dirtyFiles", "code", "parents", "bulletsBeforeFirstHeading",
		"sections", "files", "repos", "branches", "remotes", "transcripts", "finalisedCommits",
		"lastCommit", "structure", "roadmap", "work"].includes(seg)) return ["work", "detail"];
	return ["", "undecided"];
}

let store = {};
try { store = JSON.parse(localStorage.getItem("perch-atlas-v1") ?? "{}"); } catch {}
const save = () => { try { localStorage.setItem("perch-atlas-v1", JSON.stringify(store)); } catch {} };
const keyOf = (src, path) => `${src}:${path}`;
const parentOf = (path) => {
	if (path.endsWith("[]") || path.endsWith("{}")) return path.slice(0, -2);
	const i = path.lastIndexOf(".");
	return i === -1 ? "" : path.slice(0, i);
};

/* Effective assignment: your own click, then an explicit seed, then the
   nearest ancestor you clicked (the cascade), then the rule proposal. */
function assignment(src, path) {
	const own = store[keyOf(src, path)] ?? {};
	const seed = SEEDS[keyOf(src, path)];
	let cat = own.cat ?? seed?.[0];
	let dest = own.dest ?? seed?.[1];
	let via = own.cat || own.dest ? "you" : cat !== undefined ? "seed" : null;
	if (cat === undefined || dest === undefined) {
		for (let p = parentOf(path); p; p = parentOf(p)) {
			const o = store[keyOf(src, p)];
			if (o && (o.cat || o.dest)) {
				cat = cat ?? o.cat;
				dest = dest ?? o.dest;
				via = via ?? "inherited";
				break;
			}
		}
	}
	if (cat === undefined || cat === "" || dest === undefined || dest === "undecided") {
		const [rc, rd] = ruleFor(src, path);
		if (cat === undefined || cat === "") cat = rc;
		if (dest === undefined || dest === "undecided") dest = rd;
		via = via ?? (rd === "undecided" ? "" : "rule");
	}
	return { cat, dest, via: via ?? "" };
}

const isLeaf = (f) => f.types.some((t) => t !== "object" && t !== "array");
let leafTotal = 0;
for (const s of sources) leafTotal += s.fields.filter(isLeaf).length;

const esc = (t) => t.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll('"', "&quot;");
const content = document.getElementById("content");
const srcnav = document.getElementById("srcnav");

function rowEl(src, f) {
	const r = document.createElement("div");
	const depth = f.path.split(".").length - 1;
	const leaf = isLeaf(f);
	r.className = `frow ${leaf ? "" : "container"}`;
	r.dataset.src = src;
	r.dataset.path = f.path;
	r.dataset.leaf = leaf ? "1" : "";
	const lastDot = f.path.lastIndexOf(".");
	const label = lastDot === -1 ? f.path : f.path.slice(lastDot + 1);
	r.innerHTML = `
		<span class="path" style="padding-left:${depth * 18}px" title="${esc(f.path)}"><span class="dim">${lastDot === -1 ? "" : "· "}</span>${esc(label)}</span>
		<span class="decl">${esc(f.declared ?? f.types.join(" | "))}</span>
		<span class="ex" title="${esc(f.examples.join("   "))}">${esc(f.examples.join("  ·  "))}</span>
		<span class="pres">${f.count}/${f.parentCount}</span>
		<span class="tags cats">${CATS.map((x) => `<button class="${x}" data-cat="${x}" title="${esc(CAT_DEFS[x])}">${x}</button>`).join("")}</span>
		<span class="tags dests">${DESTS.map((x) => `<button class="${x}" data-dest="${x}" title="${esc(DEST_DEFS[x])}">${x}</button>`).join("")}</span>
		<span class="via"></span>`;
	r.addEventListener("click", (e) => {
		const b = e.target.closest("button");
		if (!b) return;
		const k = keyOf(src, f.path);
		store[k] = store[k] ?? {};
		if (b.dataset.cat) store[k].cat = b.dataset.cat;
		if (b.dataset.dest) store[k].dest = b.dataset.dest;
		save();
		refresh();
	});
	return r;
}

function render() {
	content.innerHTML = "";
	srcnav.innerHTML = "";
	for (const s of sources) {
		const sec = document.createElement("section");
		sec.innerHTML = `<h2>${esc(s.name)}</h2><div class="file">${esc(s.file)}</div>`;
		const list = document.createElement("div");
		list.className = "flist";
		for (const f of s.fields) list.appendChild(rowEl(s.name, f));
		sec.appendChild(list);
		content.appendChild(sec);
		const row = document.createElement("div");
		row.className = "src";
		row.innerHTML = `<span class="nm">${esc(s.name)}</span><span class="ct" data-src="${esc(s.name)}"></span>`;
		row.addEventListener("click", () => sec.scrollIntoView({ behavior: "smooth" }));
		srcnav.appendChild(row);
	}
	refresh();
}

const fcat = document.getElementById("fcat");
const fdest = document.getElementById("fdest");
for (const x of CATS) fcat.insertAdjacentHTML("beforeend", `<option>${x}</option>`);
for (const x of DESTS) fdest.insertAdjacentHTML("beforeend", `<option>${x}</option>`);
const search = document.getElementById("search");
for (const elx of [fcat, fdest]) elx.addEventListener("change", refresh);
search.addEventListener("input", refresh);

function refresh() {
	const q = search.value.toLowerCase();
	const wantCat = fcat.value, wantDest = fdest.value;
	const perSrc = {};
	let assigned = 0;
	for (const r of content.querySelectorAll(".frow")) {
		const { src, path, leaf } = r.dataset;
		const a = assignment(src, path);
		if (leaf) {
			perSrc[src] = perSrc[src] ?? { total: 0, done: 0 };
			perSrc[src].total++;
			if (a.dest !== "undecided") {
				assigned++;
				perSrc[src].done++;
			}
		}
		r.classList.toggle("undecided", a.dest === "undecided");
		r.classList.toggle("hidden-dest", a.dest === "hidden");
		for (const b of r.querySelectorAll("[data-cat]")) b.classList.toggle("on", b.dataset.cat === a.cat);
		for (const b of r.querySelectorAll("[data-dest]")) b.classList.toggle("on", b.dataset.dest === a.dest);
		r.querySelector(".via").textContent = a.via;
		const visible = (!q || path.toLowerCase().includes(q))
			&& (!wantCat || a.cat === wantCat)
			&& (!wantDest || a.dest === wantDest);
		r.style.display = visible ? "" : "none";
	}
	for (const sec of content.querySelectorAll("section")) {
		const any = [...sec.querySelectorAll(".frow")].some((r) => r.style.display !== "none");
		sec.style.display = any ? "" : "none";
	}
	for (const ct of srcnav.querySelectorAll(".ct")) {
		const p = perSrc[ct.dataset.src] ?? { total: 0, done: 0 };
		ct.innerHTML = `<b>${p.done}</b>/${p.total}`;
	}
	document.getElementById("progress").innerHTML = `<b>${assigned}</b> of ${leafTotal} placed`;
}

document.getElementById("export").addEventListener("click", () => {
	const lines = ["# Data placement", "", `Exported ${new Date().toISOString().slice(0, 16)} from the atlas.`];
	for (const s of sources) {
		const leafFields = s.fields.filter(isLeaf);
		if (!leafFields.length) continue;
		lines.push("", `## ${s.name}`, "", "| field | declared | presence | category | destination |", "| --- | --- | --- | --- | --- |");
		for (const f of leafFields) {
			const a = assignment(s.name, f.path);
			const decl = (f.declared ?? f.types.join(" | ")).replaceAll("|", "\\|");
			lines.push(`| \`${f.path}\` | \`${decl}\` | ${f.count}/${f.parentCount} | ${a.cat || "TBD"} | ${a.dest === "undecided" ? "TBD" : a.dest} |`);
		}
	}
	document.getElementById("out").value = lines.join("\n");
	document.getElementById("overlay").classList.add("show");
});
document.getElementById("close").addEventListener("click", () => document.getElementById("overlay").classList.remove("show"));
document.getElementById("copy").addEventListener("click", async () => {
	const out = document.getElementById("out");
	try { await navigator.clipboard.writeText(out.value); } catch { out.select(); }
});
window.addEventListener("keydown", (e) => { if (e.key === "Escape") document.getElementById("overlay").classList.remove("show"); });

render();
</script>
</body>
</html>
